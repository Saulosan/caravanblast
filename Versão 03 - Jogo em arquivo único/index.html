<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Caravan Blast!</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:monospace;color:#fff;}
    #shell{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:center;}
    #hud-left,#hud-right{flex:1;display:flex;flex-direction:column;padding:10px 8px;gap:6px;background:#111;min-width:0;overflow:hidden;}
    #hud-left{align-items:flex-end;border-right:1px solid #333;}
    #hud-right{align-items:flex-start;border-left:1px solid #333;}
    #canvas-wrap{flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#000;}
    canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
    #gif-pool{position:fixed;left:-9999px;top:0;pointer-events:none;}
    .hud-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;}
    .hud-value{font-size:18px;color:#fff;line-height:1.2;font-weight:bold;}
    .hud-sep{width:100%;height:1px;background:#222;margin:2px 0;}
    .life-pip{width:10px;height:10px;background:#ff4444;border-radius:50%;margin:1px 0;}
    .cmd-block{display:flex;flex-direction:column;gap:3px;width:100%;}
    .cmd-row{display:flex;align-items:center;gap:5px;font-size:12px;}
    .cmd-key{background:#333;border:1px solid #555;border-radius:3px;padding:1px 5px;font-size:11px;color:#ff0;font-weight:bold;min-width:22px;text-align:center;}
    .cmd-desc{color:#bbb;font-size:11px;}
    .dbg-on{color:#0f0 !important;}
    .bar-wrap{width:100%;display:flex;flex-direction:column;gap:2px;}
    .bar-bg{width:100%;height:10px;background:#222;border:1px solid #444;border-radius:2px;overflow:hidden;}
    .bar-fill{height:100%;border-radius:2px;}
    .thumb-wrap{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;}
    .thumb-label{font-size:7px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center;}
    .thumb-canvas{image-rendering:pixelated;border:1px solid #333;width:100%;height:28px;}
    .thumb-ok{border-color:#0a0 !important;}
    .thumb-err{border-color:#f00 !important;}
    #gp-indicator{font-size:9px;margin-top:4px;color:#555;transition:color .3s;}
    #gp-indicator.on{color:#0f0;}
  </style>
</head>
<body>
<div id="shell">
  <div id="hud-left">
    <div><div class="hud-label">Score</div><div class="hud-value" id="ui-score">000000</div></div>
    <div class="hud-sep"></div>
    <div><div class="hud-label">Vidas</div><div id="ui-lives" style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;"></div></div>
    <div class="hud-sep"></div>
    <div><div class="hud-label">Fase</div><div class="hud-value">01</div></div>
    <div class="hud-sep"></div>
    <div><div class="hud-label">Medalhas</div><div class="hud-value" id="ui-medals">0</div></div>
    <div class="hud-sep"></div>
    <div class="bar-wrap">
      <div class="hud-label">Combo <span id="ui-combo-x" style="color:#ff0;font-size:14px;">x1</span></div>
      <div class="bar-bg"><div class="bar-fill" id="ui-combo-bar" style="background:linear-gradient(90deg,#ff8800,#ffdd00);width:100%;"></div></div>
    </div>
    <div class="hud-sep"></div>
    <div class="bar-wrap">
      <div class="hud-label">Laser</div>
      <div class="bar-bg"><div class="bar-fill" id="ui-laser-bar" style="width:100%;"></div></div>
      <div style="font-size:9px;color:#446;" id="ui-laser-status">pronto</div>
    </div>
    <div class="hud-sep"></div>
    <div id="boss-hp-wrap" style="display:none">
      <div class="hud-label">Boss HP</div>
      <div class="hud-value" id="ui-bosshp" style="color:#f44;">---</div>
    </div>
    <div style="margin-top:auto;">
      <div class="hud-sep"></div>
      <div class="hud-label" style="margin-bottom:4px;">Controles</div>
      <div class="cmd-block">
        <div class="cmd-row"><span class="cmd-key">←→↑↓</span><span class="cmd-desc">Mover</span></div>
        <div class="cmd-row"><span class="cmd-key">X</span><span class="cmd-desc">Tiro</span></div>
        <div class="cmd-row"><span class="cmd-key">C</span><span class="cmd-desc">Laser</span></div>
        <div class="cmd-row"><span class="cmd-key">A</span><span class="cmd-desc">Tiro 🎮</span></div>
        <div class="cmd-row"><span class="cmd-key">X</span><span class="cmd-desc">Laser 🎮</span></div>
      </div>
      <div id="gp-indicator">🎮 sem controle</div>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game" width="480" height="640"></canvas>
  </div>
  <div id="hud-right">
    <div class="hud-label" style="color:#555;">── DEBUG ──</div>
    <div class="cmd-block" style="margin-bottom:4px;">
      <div class="cmd-row"><span class="cmd-key">B</span><span class="cmd-desc" style="color:#f88;">Boss</span></div>
      <div class="cmd-row"><span class="cmd-key">N</span><span class="cmd-desc" id="dbg-lives-lbl">∞ Vidas</span></div>
      <div class="cmd-row"><span class="cmd-key">M</span><span class="cmd-desc" id="dbg-inv-lbl">Invenc.</span></div>
    </div>
    <div class="hud-sep"></div>
    <div class="hud-label" style="color:#444;">BG Layers</div>
    <div id="dbg-bg"></div>
    <div class="hud-label" style="color:#444;margin-top:4px;">Sprites</div>
    <div id="dbg-spr"></div>
  </div>
</div>
<div id="gif-pool">
  <canvas id="gc-player"></canvas><canvas id="gc-shot"></canvas>
  <canvas id="gc-laser"></canvas><canvas id="gc-enemy"></canvas>
  <canvas id="gc-enemy2"></canvas><canvas id="gc-enemy3"></canvas>
  <canvas id="gc-enemy4"></canvas>
  <canvas id="gc-bullet"></canvas><canvas id="gc-boss"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/gifler@0.1.0/gifler.min.js"></script>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const wrap=document.getElementById("canvas-wrap");
const VW=480,VH=640;
ctx.imageSmoothingEnabled=false;

function resize(){
  const availW=wrap.clientWidth||window.innerWidth*0.6;
  const availH=wrap.clientHeight||window.innerHeight;
  const s=Math.max(1,Math.min(Math.floor(availW/VW),Math.floor(availH/VH)));
  canvas.style.width=(VW*s)+"px";canvas.style.height=(VH*s)+"px";
}
window.addEventListener("resize",resize);
requestAnimationFrame(()=>{resize();requestAnimationFrame(resize);});

const DEAD=0.22;
let gpConnected=false;
const gpInd=document.getElementById("gp-indicator");
window.addEventListener("gamepadconnected",e=>{gpConnected=true;gpInd.textContent="🎮 "+e.gamepad.id.slice(0,22);gpInd.classList.add("on");});
window.addEventListener("gamepaddisconnected",()=>{gpConnected=false;gpInd.textContent="🎮 sem controle";gpInd.classList.remove("on");});
function readGamepad(){
  const gps=navigator.getGamepads();let gp=null;
  for(let i=0;i<gps.length;i++){if(gps[i]){gp=gps[i];break;}}
  if(!gp)return;
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  if(ax<-DEAD||gp.buttons[14]?.pressed)K["ArrowLeft"]=true;else if(!K["ArrowLeft"])K["ArrowLeft"]=false;
  if(ax> DEAD||gp.buttons[15]?.pressed)K["ArrowRight"]=true;else if(!K["ArrowRight"])K["ArrowRight"]=false;
  if(ay<-DEAD||gp.buttons[12]?.pressed)K["ArrowUp"]=true;else if(!K["ArrowUp"])K["ArrowUp"]=false;
  if(ay> DEAD||gp.buttons[13]?.pressed)K["ArrowDown"]=true;else if(!K["ArrowDown"])K["ArrowDown"]=false;
  if(gp.buttons[0]?.pressed)K["KeyX"]=true;else if(!K["KeyX"])K["KeyX"]=false;
  if(gp.buttons[2]?.pressed)K["KeyC"]=true;else if(!K["KeyC"])K["KeyC"]=false;
  if(gp.buttons[7]?.pressed)K["KeyC"]=true;
  if(gp.buttons[6]?.pressed)K["KeyX"]=true;
  if(gp.buttons[9]?.pressed){
    if(appState==="title")startFromTitle();
    else if(appState==="gameover")resetGame();
    else if(appState==="win")resetGame();
  }
}

const BGM={stage1:new Audio("bgm/stage1.mp3"),boss:new Audio("bgm/boss.mp3")};
BGM.stage1.loop=true;BGM.stage1.volume=0.7;
BGM.boss.loop=true;BGM.boss.volume=0.7;
let currentBGM=null;
function playBGM(key){if(currentBGM){currentBGM.pause();currentBGM.currentTime=0;}currentBGM=BGM[key]||null;if(currentBGM)currentBGM.play().catch(()=>{});}
function stopBGM(){if(currentBGM){currentBGM.pause();currentBGM.currentTime=0;currentBGM=null;}}

const TW=52,TH=28;
function mkThumb(container,label){
  const w=document.createElement("div");w.className="thumb-wrap";
  const l=document.createElement("div");l.className="thumb-label";l.textContent=label;
  const c=document.createElement("canvas");c.className="thumb-canvas";c.width=TW;c.height=TH;
  w.appendChild(l);w.appendChild(c);container.appendChild(w);return c;
}
function updThumb(cvs,src,ok){
  const tc=cvs.getContext("2d");tc.imageSmoothingEnabled=false;tc.clearRect(0,0,TW,TH);
  if(ok&&src&&(src.naturalWidth||src.width)>0){tc.drawImage(src,0,0,TW,TH);cvs.classList.add("thumb-ok");cvs.classList.remove("thumb-err");}
  else{tc.fillStyle="#300";tc.fillRect(0,0,TW,TH);tc.fillStyle="#f55";tc.font="8px monospace";tc.fillText("ERR",4,18);cvs.classList.add("thumb-err");cvs.classList.remove("thumb-ok");}
}

const bgLayers=[
  {src:"bg/bg-fase-01.png",speed:20,img:new Image(),scroll:0},
  {src:"bg/bg-fase-01a.png",speed:45,img:new Image(),scroll:0},
  {src:"bg/bg-fase-01b.png",speed:70,img:new Image(),scroll:0},
  {src:"bg/bg-fase-01c.png",speed:100,img:new Image(),scroll:0},
  {src:"bg/bg-fase-01d.png",speed:24,img:new Image(),scroll:0},
];
let bgReady=0,bgSpeedMult=1,bgSpeedTarget=1;
const dbgBG=document.getElementById("dbg-bg");
bgLayers.forEach(l=>{
  l.thumb=mkThumb(dbgBG,l.src.split("/").pop());
  l.img.onload=()=>{bgReady++;updThumb(l.thumb,l.img,true);checkStart();};
  l.img.onerror=()=>{bgReady++;updThumb(l.thumb,null,false);checkStart();};
  l.img.src=l.src;
});
function drawLayer(img,scroll,dt,speed){
  if(!img||img.naturalWidth===0)return scroll;
  const scale=Math.max(1,Math.floor(VW/img.naturalWidth));
  const dw=img.naturalWidth*scale,dh=img.naturalHeight*scale,dx=Math.floor((VW-dw)/2);
  scroll=(scroll+speed*bgSpeedMult*dt)%dh;
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(img,dx,scroll,dw,dh);ctx.drawImage(img,dx,scroll-dh,dw,dh);
  return scroll;
}
function drawBG(dt){
  bgSpeedMult+=(bgSpeedTarget-bgSpeedMult)*1.2*dt;
  ctx.fillStyle="#000";ctx.fillRect(0,0,VW,VH);
  for(const l of bgLayers)l.scroll=drawLayer(l.img,l.scroll,dt,l.speed);
}

const SCALE={player:2,shot:1,bullet:2,enemy:2,enemy2:1,enemy3:2,enemy4:2,laser:1,boss:0.5};
function sw(c,key){if(!rdy(c))return 32;const s=SCALE[key];return s<1?Math.max(1,Math.floor(c.width*s)):c.width*s;}
function sh(c,key){if(!rdy(c))return 32;const s=SCALE[key];return s<1?Math.max(1,Math.floor(c.height*s)):c.height*s;}
function rdy(c){return c&&c.width>0&&c.height>0;}

const gc={
  player:document.getElementById("gc-player"),shot:document.getElementById("gc-shot"),
  laser:document.getElementById("gc-laser"),enemy:document.getElementById("gc-enemy"),
  enemy2:document.getElementById("gc-enemy2"),enemy3:document.getElementById("gc-enemy3"),
  enemy4:document.getElementById("gc-enemy4"),
  bullet:document.getElementById("gc-bullet"),boss:document.getElementById("gc-boss"),
};
const GIF_DEFS=[
  {key:"player",src:"player.gif"},{key:"shot",src:"tiro-01.gif"},
  {key:"laser",src:"tiro-02.gif"},{key:"enemy",src:"Enemy.gif"},
  {key:"enemy2",src:"Enemy2.gif"},{key:"enemy3",src:"Enemy3.gif"},
  {key:"enemy4",src:"Enemy4.gif"},
  {key:"bullet",src:"bullet.gif"},{key:"boss",src:"Boss1.gif"},
];
let gifReady=0;
const dbgSpr=document.getElementById("dbg-spr");
const gifThumbs={};
GIF_DEFS.forEach(def=>{gifThumbs[def.key]=mkThumb(dbgSpr,def.src);});
const TOTAL_GIFS=GIF_DEFS.length;
function onGifRdy(key){gifReady++;updThumb(gifThumbs[key],gc[key],true);checkStart();setInterval(()=>updThumb(gifThumbs[key],gc[key],true),300);}
function loadGif(src,cvs,key){
  let first=true;
  gifler(src).frames(cvs,(c2,f)=>{
    cvs.width=f.width;cvs.height=f.height;c2.clearRect(0,0,f.width,f.height);c2.drawImage(f.buffer,0,0);
    if(first){first=false;onGifRdy(key);}
  },true);
}
GIF_DEFS.forEach(def=>loadGif(def.src,gc[def.key],def.key));

let gameStarted=false;
function checkStart(){if(bgReady>=5&&gifReady>=TOTAL_GIFS&&!gameStarted){gameStarted=true;resize();requestAnimationFrame(loop);}}

const flashCvs=document.createElement("canvas");
function spr(c,key,x,y){
  if(!rdy(c)){ctx.fillStyle="#f0f";ctx.fillRect(x,y,sw(c,key),sh(c,key));return;}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(c,x,y,sw(c,key),sh(c,key));
}
function sprFlash(c,key,x,y,r,g,b,alpha){
  const fw=sw(c,key),fh=sh(c,key);
  if(!rdy(c)){ctx.save();ctx.globalAlpha=alpha||0.5;ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(x,y,fw,fh);ctx.restore();return;}
  flashCvs.width=Math.max(1,Math.ceil(fw));flashCvs.height=Math.max(1,Math.ceil(fh));
  const fc=flashCvs.getContext("2d");
  fc.imageSmoothingEnabled=false;fc.clearRect(0,0,fw,fh);fc.drawImage(c,0,0,fw,fh);
  fc.globalCompositeOperation="source-atop";fc.fillStyle=`rgba(${r},${g},${b},${alpha||0.5})`;fc.fillRect(0,0,fw,fh);
  ctx.imageSmoothingEnabled=false;ctx.drawImage(flashCvs,x,y);
}

const K={};
let infiniteLives=false,invincible=false;
window.addEventListener("keydown",e=>{
  K[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyX","KeyC","Space","KeyB","KeyN","KeyM"].includes(e.code))e.preventDefault();
  if(appState==="title"){startFromTitle();return;}
  if(appState==="gameover"){resetGame();return;}
  if(appState==="win"){resetGame();return;}
  if(e.code==="KeyB"&&stage===0)doBossSkip();
  if(e.code==="KeyN"){infiniteLives=!infiniteLives;document.getElementById("dbg-lives-lbl").classList.toggle("dbg-on",infiniteLives);}
  if(e.code==="KeyM"){invincible=!invincible;document.getElementById("dbg-inv-lbl").classList.toggle("dbg-on",invincible);}
});
window.addEventListener("keyup",e=>{K[e.code]=false;});

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ang=(ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);
function rOvlp(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function cRHit(cx,cy,cr,rx,ry,rw,rh){const tx=clamp(cx,rx,rx+rw),ty=clamp(cy,ry,ry+rh);return(cx-tx)**2+(cy-ty)**2<=cr*cr;}

let appState="title",titleT=0;
let introFlash=0,introFlashCount=0,introFlashOn=false;
let score=0,medals=0,gameOver=false,lastT=0,phaseT=0;
let stage=0,warnT=0,warnB=0;
const BOSS_AT=4*60,WARN_DUR=4;
const COMBO_DUR=2.5;
let comboX=1,comboT=COMBO_DUR,comboKills=0,comboBossLock=false;
const LASER_MAX=4.0,LASER_COOLDOWN=10.0;
let laserEnergy=LASER_MAX,laserCD=0,laserUsing=false;
let screenFlash=0;
let bossDeathT=0,bossDeathPhase="",bossNova=0,bossFadeAlpha=1;
let bossDeathRot=0,bossDeathScale=1,bossNovaStartScale=1;

const G={
  player:{x:VW/2-40,y:VH-120,w:80,h:80,spd:280,lMult:0.5,lives:3,inv:0,fire:0,hbr:6,collectR:104},
  pShots:[],eBullets:[],enemies:[],expl:[],medals:[],
  boss:null,spawnT:1.5,waveIdx:0,killN:0
};
function syncPlayerSize(){if(!rdy(gc.player))return;G.player.w=sw(gc.player,"player");G.player.h=sh(gc.player,"player");}

function resetGame(){
  stopBGM();
  score=0;medals=0;gameOver=false;phaseT=0;
  stage=0;warnT=0;warnB=0;
  comboX=1;comboT=COMBO_DUR;comboKills=0;comboBossLock=false;
  laserEnergy=LASER_MAX;laserCD=0;laserUsing=false;screenFlash=0;
  G.player.x=VW/2-40;G.player.y=VH-120;G.player.lives=3;G.player.inv=0;G.player.fire=0;
  G.pShots=[];G.eBullets=[];G.enemies=[];G.expl=[];G.medals=[];
  G.boss=null;G.spawnT=1.5;G.waveIdx=0;G.killN=0;
  bgSpeedMult=1;bgSpeedTarget=1;
  bossDeathT=0;bossDeathPhase="";bossNova=0;bossFadeAlpha=1;bossDeathRot=0;bossDeathScale=1;bossNovaStartScale=1;
  document.getElementById("boss-hp-wrap").style.display="none";
  appState="title";
}

function startFromTitle(){if(appState!=="title")return;appState="intro";introFlash=0;introFlashCount=0;introFlashOn=true;}
function updateTitle(dt){titleT+=dt;}
function updateIntro(dt){
  introFlash+=dt;
  if(introFlash>0.18){introFlash=0;introFlashCount++;introFlashOn=!introFlashOn;if(introFlashCount>=6){appState="game";playBGM("stage1");}}
}
function drawTitle(dt){
  drawBG(dt);ctx.save();ctx.fillStyle="rgba(0,0,0,0.55)";ctx.fillRect(0,0,VW,VH);
  ctx.textAlign="center";
  ctx.font="bold 54px 'Georgia',serif";ctx.strokeStyle="#ff8800";ctx.lineWidth=6;
  ctx.strokeText("Caravan",VW/2,VH/2-110);ctx.strokeText("Blast!",VW/2,VH/2-52);
  const grad=ctx.createLinearGradient(0,VH/2-170,0,VH/2-40);
  grad.addColorStop(0,"#fff");grad.addColorStop(0.4,"#ffe066");grad.addColorStop(1,"#ff8800");
  ctx.fillStyle=grad;ctx.fillText("Caravan",VW/2,VH/2-110);ctx.fillText("Blast!",VW/2,VH/2-52);
  ctx.font="22px 'Georgia',serif";ctx.fillStyle="#aaccff";ctx.strokeStyle="#002266";ctx.lineWidth=3;
  ctx.strokeText("キャラバンブラスト",VW/2,VH/2-8);ctx.fillText("キャラバンブラスト",VW/2,VH/2-8);
  const pulse=0.6+0.4*Math.sin(titleT*3.5);
  ctx.font="14px monospace";ctx.globalAlpha=pulse;ctx.fillStyle="#fff";ctx.strokeStyle="#000";ctx.lineWidth=2;
  ctx.strokeText("Aperte qualquer tecla para iniciar",VW/2,VH-90);ctx.fillText("Aperte qualquer tecla para iniciar",VW/2,VH-90);
  ctx.globalAlpha=1;
  if(gpConnected){ctx.font="11px monospace";ctx.fillStyle="#0f0";ctx.globalAlpha=0.8;ctx.fillText("🎮 Controle conectado",VW/2,VH-60);}
  ctx.globalAlpha=1;ctx.font="10px monospace";ctx.fillStyle="#556";
  ctx.fillText("2026 - First Demo by SauloSan",VW/2,VH-20);
  ctx.textAlign="left";ctx.restore();
}
function drawIntro(dt){
  drawBG(dt);ctx.save();ctx.fillStyle="rgba(0,0,0,0.55)";ctx.fillRect(0,0,VW,VH);
  if(introFlashOn){ctx.textAlign="center";ctx.font="14px monospace";ctx.fillStyle="#fff";ctx.fillText("Aperte qualquer tecla para iniciar",VW/2,VH-90);ctx.textAlign="left";}
  ctx.restore();
}

const WAVES=[
  {t:"small",n:3},{t:"small",n:5},{t:"medA",n:2},{t:"small",n:3},
  {t:"medB",n:1},{t:"small",n:5},{t:"medC",n:3},{t:"medA",n:2},
  {t:"small",n:3},{t:"medB",n:1},{t:"medA",n:3},{t:"medC",n:3},
  {t:"small",n:5},{t:"medB",n:2},{t:"medC",n:3},{t:"medA",n:2},
];
function countMedB(){return G.enemies.filter(e=>e.kind==="medB"&&e.alive&&!e.dead).length;}
function nextWave(){
  if(stage!==0)return;
  const w=WAVES[G.waveIdx%WAVES.length];G.waveIdx++;
  for(let i=0;i<w.n;i++){
    const off=i*(w.t==="small"?0.15:0.22);
    if(w.t==="small")G.enemies.push(mkSmall(off));
    else if(w.t==="medA")G.enemies.push(mkMedA(off));
    else if(w.t==="medB"){if(countMedB()<2)G.enemies.push(mkMedB(off));}
    else if(w.t==="medC")G.enemies.push(mkMedC(off,i));
  }
}

function mkSmall(tOff){
  const w=sw(gc.enemy,"enemy"),h=sh(gc.enemy,"enemy");
  const startX=40+Math.random()*(VW-80);
  const goRight=startX<VW/2;
  const endX=goRight?VW+80:-80;
  const endY=120+Math.random()*280;
  const cpX=goRight?startX+VW*0.6:startX-VW*0.6;
  const cpY=endY*0.5;
  return{kind:"small",t:0,dur:4.2+Math.random()*1.2,startX,startY:-h-10,endX,endY,cpX,cpY,

function mkMedC(tOff,i){

function mkBul(x,y,vx,vy){const w=sw(gc.bullet,"bullet"),h=sh(gc.bullet,"bullet");G.eBullets.push({x,y,vx,vy,w,h,alive:true});}
function shootAim(x,y,spd){const a=ang(x,y,G.player.x+G.player.w/2,G.player.y+G.player.h/2);mkBul(x,y,Math.cos(a)*spd,Math.sin(a)*spd);}
function shootSpray(x,y,n,spread,spd){const base=ang(x,y,G.player.x+G.player.w/2,G.player.y+G.player.h/2);for(let i=0;i<n;i++){const a=base-spread/2+(i/(n-1))*spread;mkBul(x,y,Math.cos(a)*spd,Math.sin(a)*spd);}}
function shootRing(x,y,n,spd,offset){const off=offset||0;for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+off;mkBul(x,y,Math.cos(a)*spd,Math.sin(a)*spd);}}
function shootDown(x,y,spd){mkBul(x,y,0,spd);}

function onEnemyKilled(pts){
  score+=pts*comboX;
  if(!comboBossLock){comboKills++;comboT=COMBO_DUR;const nx=Math.min(10,1+Math.floor(comboKills/5));if(nx>comboX)comboX=nx;}

function onMedalCollected(){
  if(!comboBossLock){comboT=Math.min(COMBO_DUR,comboT+0.6);}
  if(laserCD>0){const pct=0.005+((comboX-1)/9)*0.245;laserCD=Math.max(0,laserCD-LASER_COOLDOWN*pct);laserEnergy=Math.min(LASER_MAX,(1-(laserCD/LASER_COOLDOWN))*LASER_MAX);}
}
function updCombo(dt){if(comboBossLock)return;comboT-=dt;if(comboT<=0){comboT=0;comboX=1;comboKills=0;}}
function updLaser(dt){
  laserUsing=K["KeyC"]&&laserEnergy>0&&laserCD===0;
  if(laserUsing){laserEnergy=Math.max(0,laserEnergy-dt);if(laserEnergy===0)laserCD=LASER_COOLDOWN;}
  else if(laserCD>0){laserCD=Math.max(0,laserCD-dt);laserEnergy=Math.min(LASER_MAX,(1-(laserCD/LASER_COOLDOWN))*LASER_MAX);}
  const barEl=document.getElementById("ui-laser-bar"),stEl=document.getElementById("ui-laser-status");
  barEl.style.width=((laserEnergy/LASER_MAX)*100)+"%";
  if(laserCD>0){barEl.style.background="linear-gradient(90deg,#444,#888)";stEl.textContent=`cooldown ${laserCD.toFixed(1)}s`;stEl.style.color="#888";}
  else{barEl.style.background="linear-gradient(90deg,#0088ff,#00ffee)";stEl.textContent=laserUsing?"usando...":"pronto";stEl.style.color=laserUsing?"#0ff":"#446";}
}

function updEnemies(dt){
  for(const e of G.enemies){
    if(!e.alive&&!(e.kind==="medB"&&e.dead))continue;
    if(e.hitFlash>0)e.hitFlash-=dt;
    if(e.kind==="small")updSmall(e,dt);
    else if(e.kind==="medA")updMedA(e,dt);
    else if(e.kind==="medB")updMedB(e,dt);
    else if(e.kind==="medC")updMedC(e,dt);
  }
  G.enemies=G.enemies.filter(e=>e.alive||(e.kind==="medB"&&e.dead&&e.deathScale>0.01));
}
function updSmall(e,dt){
  e.t+=dt/e.dur;const t=clamp(e.t,0,1);const mt=1-t;
  e.x=mt*mt*e.startX+2*mt*t*e.cpX+t*t*e.endX;
  e.drawY=mt*mt*e.startY+2*mt*t*e.cpY+t*t*e.endY;
  if(t>0.15&&t<0.85&&e.sFired<e.sMax){e.sTimer-=dt;if(e.sTimer<=0){shootAim(e.x+e.w/2,e.drawY+e.h/2,160);e.sFired++;e.sTimer=0.5+Math.random()*0.4;}}
  if(t>=1.0)e.alive=false;
}
function updMedA(e,dt){
  e.t+=dt/e.dur;const t=clamp(e.t,0,1);
  e.x=VW+40-(VW+80)*e.t;e.drawY=e.baseY+Math.sin(t*Math.PI*2)*70;
  if(e.t>0.1&&e.t<0.9&&e.sFired<e.sMax){e.sTimer-=dt;if(e.sTimer<=0){shootAim(e.x+e.w/2,e.drawY+e.h/2,180);mkBul(e.x+e.w/2,e.drawY+e.h/2,-50,150);e.sFired++;e.sTimer=0.5+Math.random()*0.35;}}
  if(e.t>=1.05)e.alive=false;
}
function updMedB(e,dt){
  if(e.dead){
    e.deathT+=dt;e.deathFlashT+=dt;e.deathRot+=6*dt;
    e.deathScale=Math.max(0,e.deathScale-dt*0.55);
    if(Math.random()<0.4)expl(e.x+e.w/2+(Math.random()-0.5)*e.w*0.7,e.drawY+e.h/2+(Math.random()-0.5)*e.h*0.7,"#ff2200");
    if(e.deathScale<=0.01)e.alive=false;
    return;
  }
  e.rot+=e.rotSpd*dt;const cx=e.x+e.w/2,cy=e.drawY+e.h/2;
  switch(e.phase){
    case"enter":e.y+=100*dt;e.drawY=e.y;if(e.y>=e.targetY){e.y=e.targetY;e.drawY=e.y;e.phase="idle";}break;
    case"idle":
      e.drawY=e.y;e.iTimer-=dt;e.sTimer-=dt;
      if(e.sTimer<=0){
        if(e.bCnt<e.bMax){shootAim(cx,cy,155);e.bCnt++;e.sTimer=0.18;}
        else{e.bCnt=0;e.sTimer=0.6+Math.random()*0.25;if(Math.random()<0.45)shootRing(cx,cy,8,105);}
      }
      if(e.iTimer<=0)e.phase="leave";break;
    case"leave":e.y-=110*dt;e.drawY=e.y;if(e.y<-70)e.alive=false;break;
  }
}
function updMedC(e,dt){
  if(!e.scaleReady){e.scaleIn+=dt*2.2;if(e.scaleIn>=1){e.scaleIn=1;e.scaleReady=true;}}
  e.t+=dt*0.65;e.lTimer-=dt;
  const a=e.t,den=1+Math.sin(a)*Math.sin(a);
  e.x=e.ox+(VW*0.28*Math.cos(a))/den;
  e.drawY=e.oy+(VW*0.14*Math.sin(a)*Math.cos(a))/den;
  if(e.scaleReady){e.sTimer-=dt;if(e.sTimer<=0){shootSpray(e.x+e.w/2,e.drawY+e.h/2,5,Math.PI*0.5,150);e.sTimer=1.2+Math.random()*0.6;}}
  if(e.lTimer<=0)e.alive=false;
}

function doBossSkip(){G.enemies=[];G.eBullets=[];stage=1;}

function updBoss(dt){
  const b=G.boss;if(!b)return;
  if(b.dead){
    bossDeathT+=dt;b.deathFlashT+=dt;
    if(bossDeathPhase==="dying"){
      bossDeathRot+=0.5*dt;
      bossDeathScale=Math.max(0.55,bossDeathScale-dt*0.056);
      if(Math.random()<0.55){
        const ox=(Math.random()-0.5)*b.w*bossDeathScale*0.8;
        const oy=(Math.random()-0.5)*b.h*bossDeathScale*0.8;
        expl(VW/2+ox,b.y+b.h/2+oy,Math.random()<0.5?"#ff2200":"#ffcc00");
      }
      if(bossDeathT>=8.0){bossNovaStartScale=bossDeathScale;bossDeathPhase="nova";bossNova=0;}
    }
    else if(bossDeathPhase==="nova"){
      bossNova+=360*dt;bossDeathRot+=0.8*dt;
      if(bossNova>80)bossDeathScale=Math.max(0.01,bossDeathScale-dt*0.28);
      if(bossNova>VW*1.15){screenFlash=1.0;bossDeathPhase="fade";bossFadeAlpha=1.0;}
    }
    else if(bossDeathPhase==="fade"){
      bossFadeAlpha-=dt*0.45;bossDeathRot+=1.2*dt;
      bossDeathScale=Math.max(0.001,bossDeathScale-dt*0.2);
      if(bossFadeAlpha<=0){G.boss=null;stage=4;document.getElementById("boss-hp-wrap").style.display="none";bgSpeedTarget=1;stopBGM();appState="win";}
    }
    return;
  }
  if(b.hitFlash>0)b.hitFlash-=dt;b.deathFlashT=0;
  if(b.entering){
    b.y-=b.entrySpeed*dt;
    const totalDist=b.entryStartY-b.targetY;
    const traveled=b.entryStartY-b.y;
    const prog=clamp(traveled/totalDist,0,1);
    b.entryScale=4.0-(3.0*prog);
    if(b.y<=b.targetY){b.y=b.targetY;b.entryScale=1.0;b.entering=false;b.baseY=b.targetY;b.cannonTimer=2;}
    return;
  }
  if(b.laserActive){
    b.laserVx=clamp(b.laserVx+(b.mDir*180*dt),-160,160);
    if(b.x<=10||b.x>=VW-b.w-10){b.mDir=-b.mDir;b.laserVx*=-1;}
    b.x=clamp(b.x+b.laserVx*dt,10,VW-b.w-10);
  } else {
    b.mT-=dt;if(b.mT<=0){b.vx=b.mDir*(22+Math.random()*18);b.mDir=-b.mDir;b.mT=1.8+Math.random()*1.2;}
    b.x=clamp(b.x+b.vx*dt,10,VW-b.w-10);
  }
  b.yTimer-=dt;if(b.yTimer<=0){b.yTarget=(Math.random()-0.5)*70;b.yTimer=2.5+Math.random()*2.5;}
  b.yOffset+=(b.yTarget-b.yOffset)*1.2*dt;b.y=b.baseY+b.yOffset;
  const milestone=Math.floor(b.hp/50)*50;
  if(milestone<b.lastMedalHp&&b.hp>0){b.lastMedalHp=milestone;spawnMedal(b.x+b.w/2,b.y+b.h/2,2);}
  const bx=b.x,by=b.y,bw2=b.w,bh2=b.h;
  const cannons=[{x:bx+bw2*.22,y:by+bh2*.12},{x:bx+bw2*.78,y:by+bh2*.12},{x:bx+bw2*.18,y:by+bh2*.62},{x:bx+bw2*.82,y:by+bh2*.62}];
  const diamonds=[{x:bx+bw2*.38,y:by+bh2*.32},{x:bx+bw2*.62,y:by+bh2*.32},{x:bx+bw2*.38,y:by+bh2*.68},{x:bx+bw2*.62,y:by+bh2*.68}];
  if(b.cyclePhase==="cannon"){
    b.cycleTimer+=dt;b.diamondTimer-=dt;
    if(b.diamondTimer<=0){for(const d of diamonds)shootDown(d.x,d.y,80+Math.random()*60);b.diamondTimer=1.1+Math.random()*0.5;}
    b.cannonTimer-=dt;
    if(b.cannonTimer<=0&&b.cannonIdx<4){
      const c=cannons[b.cannonIdx];shootRing(c.x,c.y,6,185,0);
      setTimeout(()=>{if(!b||b.dead)return;shootRing(c.x,c.y,6,185,Math.PI/6);},350);
      b.cannonIdx++;b.cannonTimer=1.2;
    }
    if(b.cannonIdx>=4&&b.cycleTimer>=b.cannonIdx*1.2+2){b.laserActive=true;b.laserTimer=5.0;b.laserVx=b.mDir*25;b.cyclePhase="laser";}
  } else {
    b.laserTimer-=dt;
    const lx=b.x+b.w/2,p=G.player;
    if(p.inv<=0&&!invincible&&Math.abs(p.x+p.w/2-lx)<20)dmgPlayer();
    if(b.laserTimer<=0){b.laserActive=false;b.laserVx=0;b.cyclePhase="cannon";b.cycleTimer=0;b.cannonIdx=0;b.cannonTimer=1.5;b.diamondTimer=0.5;}
  }
  if(b.hp<=0&&!b.dead){
    b.dead=true;b.alive=false;
    bossDeathPhase="dying";bossDeathT=0;bossDeathRot=0;bossDeathScale=1.0;bossNovaStartScale=1.0;
    comboBossLock=false;score+=80000*comboX;
    spawnMedal(b.x+b.w/2,b.y+b.h/2,10);
    document.getElementById("boss-hp-wrap").style.display="none";bgSpeedTarget=1;stopBGM();
  }
  document.getElementById("ui-bosshp").textContent=Math.max(0,Math.ceil(b.hp));
}

function hitBoss(s){
  const b=G.boss;if(!b||b.dead||b.entering)return false;
  const lw=rdy(gc.laser)?gc.laser.width*SCALE.laser:16;
  const sr=s.type==="shot"?{x:s.x,y:s.y,w:s.w,h:s.h}:{x:s.px+s.pw/2-lw/2,y:0,w:lw,h:s.py};
  if(!rOvlp(sr,{x:b.x,y:b.y,w:b.w,h:b.h}))return false;
  b.hp=Math.max(0,b.hp-(s.type==="laser"?1.2:1));b.hitFlash=0.10;
  if(s.type==="shot")s.alive=false;return true;
}

const MEDAL_GRAVITY=320;
function spawnMedal(x,y,n){
  n=n||1;
  for(let i=0;i<n;i++)G.medals.push({x,y,vx:(Math.random()-0.5)*80,vy:30+Math.random()*40,alive:true,a:Math.random()*Math.PI*2,att:false});
}
function updMedals(dt){
  const px=G.player.x+G.player.w/2,py=G.player.y+G.player.h/2,cr=G.player.collectR;
  for(const m of G.medals){
    if(!m.alive)continue;m.a+=dt*3;
    const dx=px-m.x,dy=py-m.y,d=Math.hypot(dx,dy);
    if(d<cr||m.att){m.att=true;const spd=Math.max(600,d*10),nd=Math.hypot(dx,dy)||1;m.vx=dx/nd*spd;m.vy=dy/nd*spd;}
    else{m.vy+=MEDAL_GRAVITY*dt;}
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(m.att&&Math.hypot(px-m.x,py-m.y)<cr*0.4){m.alive=false;medals++;score+=500*comboX;onMedalCollected();expl(m.x,m.y,"#ffdd00");}
    if(!m.att&&m.y>VH+40)m.alive=false;
  }
  G.medals=G.medals.filter(m=>m.alive);
}

function collisions(){
  const p=G.player;
  for(const s of G.pShots){
    if(!s.alive)continue;
    if(G.boss&&!G.boss.dead)hitBoss(s);
    if(!s.alive)continue;
    for(const e of G.enemies){
      if(!e.alive||e.dead)continue;
      const er={x:e.x,y:e.drawY,w:e.w,h:e.h};
      const lw=rdy(gc.laser)?gc.laser.width*SCALE.laser:16;
      const hit=s.type==="shot"?rOvlp({x:s.x,y:s.y,w:s.w,h:s.h},er):rOvlp({x:s.px+s.pw/2-lw/2,y:0,w:lw,h:s.py},er);
      if(hit){
        e.hp-=(s.type==="laser"?2:1);e.hitFlash=0.10;
        if(s.type==="shot")s.alive=false;
        if(e.hp<=0&&!e.dead)killEnemy(e);
        if(s.type==="shot")break;
      }
    }
  }
  G.pShots=G.pShots.filter(s=>s.alive);
  if(p.inv<=0&&!invincible){
    for(const b of G.eBullets){
      if(!b.alive)continue;
      if(cRHit(p.x+p.w/2,p.y+p.h/2,p.hbr,b.x,b.y,b.w,b.h)){b.alive=false;dmgPlayer();break;}
    }
    for(const e of G.enemies){
      if(!e.alive||e.dead)continue;
      if(rOvlp({x:p.x+8,y:p.y+8,w:p.w-16,h:p.h-16},{x:e.x,y:e.drawY,w:e.w,h:e.h})){killEnemy(e);dmgPlayer();}
    }
  }
}
function killEnemy(e){
  const cx=e.x+e.w/2,cy=e.drawY+e.h/2;
  const medals_n=e.kind==="small"?1:e.kind==="medA"?2:e.kind==="medB"?4:2;
  const pts=e.kind==="small"?100:e.kind==="medA"?300:e.kind==="medB"?500:400;
  const col=e.kind==="small"?"#ffcc66":e.kind==="medA"?"#ffaa00":e.kind==="medB"?"#cc44ff":"#00ccff";
  if(e.kind==="medB"){e.dead=true;e.alive=true;e.deathT=0;e.deathFlashT=0;e.deathRot=0;e.deathScale=1;}
  else e.alive=false;
  expl(cx,cy,col);onEnemyKilled(pts);spawnMedal(cx,cy,medals_n);
}
function dmgPlayer(){
  const p=G.player;
  if(!infiniteLives)p.lives--;
  p.inv=1.8;expl(p.x+p.w/2,p.y+p.h/2,"#6699ff");
  p.x=VW/2-p.w/2;p.y=VH-120;
  comboX=1;comboKills=0;comboT=COMBO_DUR;
  if(p.lives<=0&&!infiniteLives){gameOver=true;stopBGM();appState="gameover";}
}
function expl(x,y,col){G.expl.push({x,y,r:4,mr:28,r2:2,mr2:16,life:.32,ml:.32,col:col||"#ffb347"});}

function update(dt){
  if(gameOver)return;
  readGamepad();phaseT+=dt;syncPlayerSize();
  switch(stage){
    case 0:G.spawnT-=dt;if(G.spawnT<=0){nextWave();G.spawnT=1.6+Math.random()*1.2;}if(phaseT>=BOSS_AT)doBossSkip();break;
    case 1:bgSpeedTarget=3;comboBossLock=true;stage=2;warnT=WARN_DUR;break;
    case 2:warnT-=dt;warnB+=dt*5;if(warnT<=0){stage=3;spawnBoss();}break;
    case 3:updBoss(dt);break;
  }
  updPlayer(dt);updShots(dt);updEnemies(dt);updCombo(dt);updLaser(dt);
  for(const b of G.eBullets){if(!b.alive)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-30||b.x>VW+30||b.y<-30||b.y>VH+30)b.alive=false;}
  G.eBullets=G.eBullets.filter(b=>b.alive);
  for(const e of G.expl){e.life-=dt;e.r+=(e.mr-e.r)*14*dt;e.r2+=(e.mr2-e.r2)*10*dt;}
  G.expl=G.expl.filter(e=>e.life>0);
  updMedals(dt);collisions();
  if(G.player.inv>0)G.player.inv-=dt;
  if(screenFlash>0)screenFlash=Math.max(0,screenFlash-dt*2.2);
  updHUD();
}
function updPlayer(dt){
  const p=G.player,spd=laserUsing?p.spd*p.lMult:p.spd;
  let mx=0,my=0;
  if(K["ArrowLeft"])mx-=1;if(K["ArrowRight"])mx+=1;if(K["ArrowUp"])my-=1;if(K["ArrowDown"])my+=1;
  if(mx&&my){mx*=Math.SQRT2/2;my*=Math.SQRT2/2;}
  p.x=clamp(p.x+mx*spd*dt,8,VW-p.w-8);p.y=clamp(p.y+my*spd*dt,8,VH-p.h-8);
  p.fire-=dt;
  if(laserUsing){if(p.fire<=0){G.pShots.push({type:"laser",px:p.x,py:p.y,pw:p.w,alive:true,ttl:.05});p.fire=.04;}}
  else if(K["KeyX"]){
    const sw2=sw(gc.shot,"shot"),sh2=sh(gc.shot,"shot");
    if(p.fire<=0){G.pShots.push({type:"shot",x:p.x+p.w/2-sw2/2,y:p.y-sh2,w:sw2,h:sh2,vy:-580,alive:true});p.fire=.075;}
  }
}
function updShots(dt){
  for(const s of G.pShots){if(!s.alive)continue;if(s.type==="shot"){s.y+=s.vy*dt;if(s.y+s.h<0)s.alive=false;}else{s.ttl-=dt;if(s.ttl<=0||!laserUsing)s.alive=false;}}
  G.pShots=G.pShots.filter(s=>s.alive);
}
function updHUD(){
  document.getElementById("ui-score").textContent=String(score).padStart(6,"0");
  document.getElementById("ui-medals").textContent=medals;
  const cx=document.getElementById("ui-combo-x"),cb=document.getElementById("ui-combo-bar");
  cx.textContent="x"+comboX;cx.style.color=comboX>=5?"#f55":comboX>=3?"#fa0":"#ff0";
  if(comboBossLock){cb.style.width="100%";cb.style.background="linear-gradient(90deg,#f44,#fa0)";}
  else{cb.style.width=((comboT/COMBO_DUR)*100)+"%";cb.style.background=comboX>=5?"linear-gradient(90deg,#f44,#f80)":comboX>=3?"linear-gradient(90deg,#f80,#ff0)":"linear-gradient(90deg,#ff8800,#ffdd00)";}
  const el=document.getElementById("ui-lives");
  if(parseInt(el.dataset.l||"99")!==G.player.lives){
    el.dataset.l=G.player.lives;el.innerHTML="";
    for(let i=0;i<G.player.lives;i++){const d=document.createElement("div");d.className="life-pip";el.appendChild(d);}
  }
}

function drawBossHPBar(b){
  if(!b||b.dead||b.entering)return;
  const pct=b.hp/b.hpMax,bx=8,by=4,bw2=VW-16,bh2=8;
  ctx.fillStyle="rgba(0,0,0,0.65)";ctx.fillRect(bx-1,by-1,bw2+2,bh2+2);
  ctx.fillStyle="#111";ctx.fillRect(bx,by,bw2,bh2);
  const gr=ctx.createLinearGradient(bx,0,bx+bw2,0);
  gr.addColorStop(0,"#ff2200");gr.addColorStop(.5,"#ff8800");gr.addColorStop(1,"#ffdd00");
  ctx.fillStyle=gr;ctx.fillRect(bx,by,bw2*pct,bh2);
  ctx.strokeStyle="#555";ctx.lineWidth=1;ctx.strokeRect(bx,by,bw2,bh2);
  ctx.fillStyle="#aaa";ctx.font="bold 7px monospace";ctx.textAlign="left";ctx.fillText("BOSS",bx,by-1);
}

function drawBoss(b){
  if(!b)return;
  const bw=sw(gc.boss,"boss"),bh=sh(gc.boss,"boss");
  const cx=b.x+bw/2,cy=b.y+bh/2;
  if(!b.dead&&!b.entering&&b.laserActive){
    const pulse=0.6+0.4*Math.sin(Date.now()*.015),lw=18+Math.floor(pulse*8);
    ctx.save();ctx.shadowColor="#00ff44";ctx.shadowBlur=30;ctx.fillStyle=`rgba(0,255,68,${pulse*.22})`;ctx.fillRect(cx-lw*2,cy,lw*4,VH);ctx.restore();
    ctx.save();ctx.shadowColor="#aaffbb";ctx.shadowBlur=16;ctx.fillStyle=`rgba(180,255,200,${.7+pulse*.3})`;ctx.fillRect(cx-lw/2,cy,lw,VH);ctx.fillStyle=`rgba(255,255,255,${pulse*.6})`;ctx.fillRect(cx-lw/4,cy,lw/2,VH);ctx.restore();
  }
  ctx.save();
  if(b.dead){
    const alpha=bossDeathPhase==="fade"?clamp(bossFadeAlpha,0,1):1;
    ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.rotate(bossDeathRot);ctx.scale(bossDeathScale,bossDeathScale);ctx.translate(-bw/2,-bh/2);
    if(bossDeathPhase==="dying"||bossDeathPhase==="nova"){
      const ft=Math.floor(b.deathFlashT*10)%2;
      if(ft===0)sprFlash(gc.boss,"boss",0,0,255,40,0,0.7);
      else sprFlash(gc.boss,"boss",0,0,255,200,0,0.6);
    } else spr(gc.boss,"boss",0,0);
    if(bossDeathPhase==="nova"||bossDeathPhase==="fade"){
      const fade=bossDeathPhase==="fade"?clamp(bossFadeAlpha,0,1):1;
      const baseR=Math.max(bw,bh)*0.5;
      const nr=baseR+bossNova/Math.max(0.01,bossDeathScale);
      const decay=Math.max(0,1-bossNova/(VW*0.95));
      ctx.globalAlpha=fade*0.92*decay;
      const gr=ctx.createRadialGradient(bw/2,bh/2,Math.max(0,nr-60),bw/2,bh/2,nr);
      gr.addColorStop(0,"rgba(255,255,255,0)");
      gr.addColorStop(0.45,"rgba(240,248,255,0.9)");
      gr.addColorStop(0.78,"rgba(120,180,255,0.7)");
      gr.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(bw/2,bh/2,nr,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=fade*0.85*decay;
      ctx.strokeStyle="#ffffff";ctx.lineWidth=6/Math.max(0.01,bossDeathScale);
      ctx.beginPath();ctx.arc(bw/2,bh/2,nr,0,Math.PI*2);ctx.stroke();
    }
  } else if(b.entering){
    const sc=b.entryScale,dw=bw*sc,dh=bh*sc,dx=cx-dw/2,dy=cy-dh/2;
    ctx.imageSmoothingEnabled=false;
    if(rdy(gc.boss))ctx.drawImage(gc.boss,dx,dy,dw,dh);
    else{ctx.fillStyle="#f0f";ctx.fillRect(dx,dy,dw,dh);}
  } else {
    if(b.hitFlash>0&&Math.floor(b.hitFlash/.04)%2===0)sprFlash(gc.boss,"boss",b.x,b.y,255,255,255,0.6);
    else spr(gc.boss,"boss",b.x,b.y);
  }
  ctx.restore();
}

function drawPlayer(){
  const p=G.player;
  if(p.inv>0&&Math.floor(p.inv*14)%2===0)return;
  if(invincible){ctx.save();ctx.strokeStyle="rgba(80,200,255,0.5)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2,p.hbr+4,0,Math.PI*2);ctx.stroke();ctx.restore();}
  if(laserUsing||laserCD>0){
    const bw=p.w,bh=5,bx=p.x,by=p.y+p.h+4;
    ctx.fillStyle="#111";ctx.fillRect(bx,by,bw,bh);
    const pct=laserEnergy/LASER_MAX;
    const lg=ctx.createLinearGradient(bx,0,bx+bw,0);
    if(laserCD>0){lg.addColorStop(0,"#444");lg.addColorStop(1,"#888");}
    else{lg.addColorStop(0,"#0088ff");lg.addColorStop(1,"#00ffee");}
    ctx.fillStyle=lg;ctx.fillRect(bx,by,bw*pct,bh);
    ctx.strokeStyle=laserCD>0?"#555":"#0ff";ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  }
  ctx.imageSmoothingEnabled=false;spr(gc.player,"player",p.x,p.y);
}
function drawShots(){
  const lW=rdy(gc.laser)?gc.laser.width*SCALE.laser:16;
  const lH=rdy(gc.laser)?gc.laser.height*SCALE.laser:16;
  for(const s of G.pShots){
    if(s.type==="shot"){spr(gc.shot,"shot",s.x,s.y);}
    else{
      const lx=Math.round(s.px+s.pw/2-lW/2),yE=Math.round(s.py+10);
      ctx.save();ctx.globalAlpha=.25;ctx.fillStyle="#0ff";ctx.fillRect(lx-8,0,lW+16,yE);ctx.restore();
      let ty=0;while(ty<yE){const th=Math.min(lH,yE-ty);
        ctx.imageSmoothingEnabled=false;
        if(rdy(gc.laser))ctx.drawImage(gc.laser,0,0,gc.laser.width,Math.round((th/lH)*gc.laser.height),lx,ty,lW,th);
        else{ctx.fillStyle="#0ff";ctx.fillRect(lx,ty,lW,th);}ty+=lH;}
    }
  }
}
function drawEnemies(){
  for(const e of G.enemies){
    const isDying=e.kind==="medB"&&e.dead;
    if(!e.alive&&!isDying)continue;
    const flash=e.hitFlash>0&&Math.floor(e.hitFlash/0.035)%2===0;
    if(e.kind==="small"){
      if(flash)sprFlash(gc.enemy,"enemy",e.x,e.drawY,255,255,255,0.55);else spr(gc.enemy,"enemy",e.x,e.drawY);
    } else if(e.kind==="medA"){
      if(flash)sprFlash(gc.enemy4,"enemy4",e.x,e.drawY,255,255,255,0.55);else spr(gc.enemy4,"enemy4",e.x,e.drawY);
    } else if(e.kind==="medB"){
      const sc=isDying?e.deathScale:1,ecx=e.x+e.w/2,ecy=e.drawY+e.h/2;
      ctx.save();ctx.translate(ecx,ecy);if(isDying)ctx.rotate(e.deathRot);ctx.scale(sc,sc);ctx.globalAlpha=isDying?Math.max(0,e.deathScale):1;
      const ox=-e.w/2,oy=-e.h/2;
      if(isDying){const ft=Math.floor(e.deathFlashT*12)%2;if(ft===0)sprFlash(gc.enemy2,"enemy2",ox,oy,255,40,0,0.7);else sprFlash(gc.enemy2,"enemy2",ox,oy,255,220,0,0.7);}
      else if(flash)sprFlash(gc.enemy2,"enemy2",ox,oy,255,255,255,0.55);
      else spr(gc.enemy2,"enemy2",ox,oy);
      ctx.restore();
    } else if(e.kind==="medC"){
      const sc=e.scaleIn||1;
      if(sc<1){
        const dw=Math.ceil(e.w*sc),dh=Math.ceil(e.h*sc);
        if(dw>0&&dh>0){
          const dx2=e.x+(e.w-dw)/2,dy2=e.drawY+(e.h-dh)/2;
          ctx.save();ctx.imageSmoothingEnabled=false;
          if(flash){flashCvs.width=dw;flashCvs.height=dh;const fc=flashCvs.getContext("2d");fc.clearRect(0,0,dw,dh);if(rdy(gc.enemy3))fc.drawImage(gc.enemy3,0,0,dw,dh);fc.globalCompositeOperation="source-atop";fc.fillStyle="rgba(255,255,255,0.55)";fc.fillRect(0,0,dw,dh);ctx.drawImage(flashCvs,dx2,dy2);}
          else{if(rdy(gc.enemy3))ctx.drawImage(gc.enemy3,dx2,dy2,dw,dh);}
          ctx.restore();
        }
      } else {
        if(flash)sprFlash(gc.enemy3,"enemy3",e.x,e.drawY,255,255,255,0.55);else spr(gc.enemy3,"enemy3",e.x,e.drawY);
      }
    }
  }
}
function drawBullets(){for(const b of G.eBullets){if(!b.alive)continue;spr(gc.bullet,"bullet",b.x,b.y);}}
function drawExpl(){
  for(const e of G.expl){
    const a=clamp(e.life/e.ml,0,1);
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(255,255,255,${a*.6})`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(e.x,e.y,e.r2,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
}
function drawMedals(){
  for(const m of G.medals){
    if(!m.alive)continue;
    ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.a);
    const r=m.att?9:7;
    ctx.fillStyle="#ffdd00";ctx.strokeStyle="#ff8800";ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<10;i++){const a2=(i/10)*Math.PI*2-Math.PI/2,rd=i%2===0?r:r*.45;i===0?ctx.moveTo(Math.cos(a2)*rd,Math.sin(a2)*rd):ctx.lineTo(Math.cos(a2)*rd,Math.sin(a2)*rd);}
    ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  }
}
function drawComboPopup(){
  if(comboX<=1&&!comboBossLock)return;
  ctx.save();ctx.textAlign="right";
  const fs=comboX>=5?22:16;ctx.font=`bold ${fs}px monospace`;
  const col=comboX>=5?"#f55":comboX>=3?"#fa0":"#ff0";
  ctx.strokeStyle="rgba(0,0,0,0.8)";ctx.lineWidth=3;ctx.strokeText("x"+comboX,VW-8,VH-8);
  ctx.fillStyle=col;ctx.fillText("x"+comboX,VW-8,VH-8);
  ctx.textAlign="left";ctx.restore();
}
function drawWarning(){
  if(stage!==2)return;if(Math.sin(warnB*Math.PI)<=0)return;
  ctx.save();ctx.fillStyle="rgba(200,0,0,.45)";ctx.fillRect(0,VH/2-54,VW,108);
  ctx.textAlign="center";ctx.font="bold 24px monospace";ctx.strokeStyle="#f00";ctx.lineWidth=3;
  ctx.strokeText("⚠ PERIGO! PERIGO! ⚠",VW/2,VH/2-14);ctx.fillStyle="#fff";ctx.fillText("⚠ PERIGO! PERIGO! ⚠",VW/2,VH/2-14);
  ctx.font="bold 12px monospace";ctx.strokeText("NAVE MASSIVA SE APROXIMANDO RAPIDAMENTE!!",VW/2,VH/2+16);ctx.fillText("NAVE MASSIVA SE APROXIMANDO RAPIDAMENTE!!",VW/2,VH/2+16);
  ctx.textAlign="left";ctx.restore();
}
function drawScreenFlash(){
  if(screenFlash<=0)return;
  ctx.save();ctx.globalAlpha=screenFlash;ctx.fillStyle="#ffffff";ctx.fillRect(0,0,VW,VH);ctx.restore();
}
function drawWin(){
  ctx.save();ctx.fillStyle="rgba(0,0,0,.75)";ctx.fillRect(40,VH/2-70,VW-80,130);
  ctx.textAlign="center";ctx.fillStyle="#ffdd00";ctx.font="28px monospace";ctx.fillText("FASE COMPLETA!",VW/2,VH/2-18);
  ctx.fillStyle="#fff";ctx.font="13px monospace";ctx.fillText("Score: "+String(score).padStart(6,"0"),VW/2,VH/2+10);
  const pulse=0.5+0.5*Math.sin(Date.now()*.004);
  ctx.globalAlpha=pulse;ctx.fillStyle="#aef";ctx.fillText("Aperte qualquer tecla para voltar ao menu",VW/2,VH/2+34);
  ctx.globalAlpha=1;ctx.textAlign="left";ctx.restore();
}
function drawGO(){
  ctx.save();ctx.fillStyle="rgba(0,0,0,.85)";ctx.fillRect(40,VH/2-80,VW-80,150);
  ctx.textAlign="center";ctx.fillStyle="#f44";ctx.font="28px monospace";ctx.fillText("GAME OVER",VW/2,VH/2-24);
  ctx.fillStyle="#aaa";ctx.font="12px monospace";ctx.fillText("Score final: "+String(score).padStart(6,"0"),VW/2,VH/2+8);
  const pulse=0.5+0.5*Math.sin(Date.now()*.004);
  ctx.globalAlpha=pulse;ctx.fillStyle="#fff";ctx.fillText("Aperte qualquer tecla para voltar ao menu",VW/2,VH/2+34);
  ctx.globalAlpha=1;ctx.textAlign="left";ctx.restore();
}
function drawLoading(){
  ctx.fillStyle="#000";ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="14px monospace";ctx.fillText("Carregando...",VW/2,VH/2-10);
  ctx.font="11px monospace";ctx.fillStyle="#aaa";ctx.fillText(`GIF: ${gifReady}/${TOTAL_GIFS}  BG: ${bgReady}/5`,VW/2,VH/2+14);
  ctx.textAlign="left";
}

function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.033);lastT=ts;
  ctx.imageSmoothingEnabled=false;
  if(appState==="title"){updateTitle(dt);drawTitle(dt);}
  else if(appState==="intro"){updateIntro(dt);drawIntro(dt);}
  else if(appState==="gameover"){drawBG(dt);drawGO();}
  else if(appState==="win"){drawBG(dt);drawWin();}
  else{
    update(dt);
    drawBG(dt);
    if(G.boss)drawBossHPBar(G.boss);
    if(G.boss&&G.boss.entering){
      drawMedals();drawShots();drawEnemies();drawBullets();drawExpl();
      drawPlayer();
      drawBoss(G.boss);
    } else {
      if(G.boss)drawBoss(G.boss);
      drawMedals();drawShots();drawEnemies();drawBullets();drawExpl();
      drawPlayer();
    }
    drawScreenFlash();
    drawComboPopup();
    drawWarning();
  }
  requestAnimationFrame(loop);
}

(function loadingLoop(){
  if(gameStarted)return;
  const now=performance.now();lastT=now;drawLoading();requestAnimationFrame(loadingLoop);
})();
</script>
