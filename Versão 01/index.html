<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shmup Vertical - Fase 01</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:monospace; color:#fff; }
    #shell { position:fixed; inset:0; display:flex; align-items:stretch; justify-content:center; }
    #hud-left,#hud-right {
      flex:1; display:flex; flex-direction:column;
      padding:16px 10px; gap:14px; background:#000; min-width:0;
    }
    #hud-left  { align-items:flex-end;   border-right:1px solid #222; }
    #hud-right { align-items:flex-start; border-left: 1px solid #222; }
    #canvas-wrap { flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    canvas#game  { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
    #gif-pool    { position:fixed; left:-9999px; top:0; pointer-events:none; }
    .hud-label { font-size:10px; color:#666; text-transform:uppercase; letter-spacing:1px; }
    .hud-value { font-size:20px; color:#fff; line-height:1.1; }
    .life-pip  { width:10px; height:10px; background:#ff4444; border-radius:50%; margin:2px 0; }
  </style>
</head>
<body>
<div id="shell">
  <div id="hud-left">
    <div><div class="hud-label">Score</div><div class="hud-value" id="ui-score">000000</div></div>
    <div><div class="hud-label">Vidas</div><div id="ui-lives"></div></div>
    <div><div class="hud-label">Fase</div><div class="hud-value">01</div></div>
    <div><div class="hud-label">Medalhas</div><div class="hud-value" id="ui-medals">0</div></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game" width="480" height="640"></canvas>
  </div>
  <div id="hud-right">
    <div><div class="hud-label">Rank</div><div class="hud-value" id="ui-rank">C</div></div>
    <div id="boss-hp-wrap" style="display:none">
      <div class="hud-label">Boss HP</div>
      <div class="hud-value" id="ui-bosshp" style="color:#f44">---</div>
    </div>
    <div style="margin-top:auto"><div class="hud-label" style="color:#333">B=Boss</div></div>
  </div>
</div>
<div id="gif-pool">
  <canvas id="gc-player"></canvas>
  <canvas id="gc-shot"></canvas>
  <canvas id="gc-laser"></canvas>
  <canvas id="gc-enemy"></canvas>
  <canvas id="gc-enemy2"></canvas>
  <canvas id="gc-enemy3"></canvas>
  <canvas id="gc-bullet"></canvas>
  <canvas id="gc-boss"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/gifler@0.1.0/gifler.min.js"></script>
<script>
/* ═══════════════════════════════
   CANVAS
═══════════════════════════════ */
const canvas = document.getElementById("game");
const ctx    = canvas.getContext("2d");
const VW = 480, VH = 640;

function resize(){
  const s=Math.min(window.innerWidth*0.68/VW,window.innerHeight/VH);
  const cw=Math.floor(VW*s),ch=Math.floor(VH*s);
  canvas.style.width=cw+"px"; canvas.style.height=ch+"px";
  document.getElementById("canvas-wrap").style.width=cw+"px";
}
window.addEventListener("resize",resize); resize();

/* ═══════════════════════════════
   PARALLAX LAYERS
═══════════════════════════════ */
const LAYERS = [
  { src:"fase-01.png",  img:new Image(), ready:false, scroll:0, speedMult:1.0 },
  { src:"fase-01a.png", img:new Image(), ready:false, scroll:0, speedMult:1.6 },
  { src:"fase-01b.png", img:new Image(), ready:false, scroll:0, speedMult:2.4 },
  { src:"fase-01c.png", img:new Image(), ready:false, scroll:0, speedMult:3.4 },
];
const BG_BASE_NORMAL = 18;
const BG_BASE_FAST   = 54;
let bgBase = BG_BASE_NORMAL;

LAYERS.forEach(l => {
  l.img.onload  = () => { l.ready=true; onRdy(); };
  l.img.onerror = () => { l.ready=true; onRdy(); };
  l.img.src = l.src;
});

/* ═══════════════════════════════
   ESTRELAS CINTILANTES
   Partículas fixas em tela (não scrollam) que pulsam
   em alpha de forma independente — simula luz de estrelas.
   Geradas uma vez, usadas para sempre.
═══════════════════════════════ */
const STAR_COUNT = 90;
const stars = [];
(function initStars(){
  for(let i=0;i<STAR_COUNT;i++){
    stars.push({
      x: Math.random()*VW,
      y: Math.random()*VH,
      r: 0.4 + Math.random()*1.1,          // raio 0.4–1.5px
      phase: Math.random()*Math.PI*2,       // fase inicial aleatória
      speed: 0.4 + Math.random()*1.2,      // velocidade de pulsação
      baseAlpha: 0.15 + Math.random()*0.35, // brilho base
      ampAlpha:  0.15 + Math.random()*0.40, // amplitude de variação
      // cor: maioria branco-azulado, algumas levemente amareladas
      hue: Math.random()<0.8 ? 220 : 45,
      sat: Math.random()<0.8 ? 60  : 40,
    });
  }
})();

let starTime = 0; // acumula tempo global para animar estrelas

function drawStars(dt){
  starTime += dt;
  for(const s of stars){
    const alpha = s.baseAlpha + s.ampAlpha * Math.sin(s.phase + starTime * s.speed);
    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle   = `hsl(${s.hue},${s.sat}%,96%)`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    // Brilho suave em estrelas maiores
    if(s.r > 0.9){
      ctx.globalAlpha = Math.max(0, alpha * 0.35);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 2.4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ═══════════════════════════════
   ASSETS GIF  (4 bg + 8 gifs = 12)
═══════════════════════════════ */
const gc={
  player: document.getElementById("gc-player"),
  shot:   document.getElementById("gc-shot"),
  laser:  document.getElementById("gc-laser"),
  enemy:  document.getElementById("gc-enemy"),
  enemy2: document.getElementById("gc-enemy2"),
  enemy3: document.getElementById("gc-enemy3"),
  bullet: document.getElementById("gc-bullet"),
  boss:   document.getElementById("gc-boss")
};

let loaded=0;
function onRdy(){ if(++loaded>=12) startGame(); }

function loadGif(src,cvs){
  let first=true;
  gifler(src).frames(cvs,(c2,f)=>{
    cvs.width=f.width; cvs.height=f.height;
    c2.clearRect(0,0,f.width,f.height); c2.drawImage(f.buffer,0,0);
    if(first){ first=false; onRdy(); }
  },true);
}
loadGif("player.gif",  gc.player);
loadGif("tiro-01.gif", gc.shot);
loadGif("tiro-02.gif", gc.laser);
loadGif("Enemy.gif",   gc.enemy);
loadGif("Enemy2.gif",  gc.enemy2);
loadGif("Enemy3.gif",  gc.enemy3);
loadGif("bullet.gif",  gc.bullet);
loadGif("Boss1.gif",   gc.boss);

function rdy(c){ return c.width>0&&c.height>0; }
function spr(c,x,y,w,h){ if(rdy(c))ctx.drawImage(c,x,y,w,h); else{ctx.fillStyle="#f0f";ctx.fillRect(x,y,w,h);} }

const flashCanvas=document.createElement("canvas");
function sprFlash(c,x,y,w,h,alpha){
  if(!rdy(c)){ctx.save();ctx.globalAlpha=alpha||0.28;ctx.fillStyle="#fff";ctx.fillRect(x,y,w,h);ctx.restore();return;}
  const oc=flashCanvas; oc.width=w; oc.height=h;
  const oc2=oc.getContext("2d");
  oc2.clearRect(0,0,w,h);
  oc2.drawImage(c,0,0,w,h);
  oc2.globalCompositeOperation="source-atop";
  oc2.fillStyle=`rgba(255,255,255,${alpha||0.28})`;
  oc2.fillRect(0,0,w,h);
  ctx.drawImage(oc,x,y);
}

/* ═══════════════════════════════
   INPUT
═══════════════════════════════ */
const K={};
window.addEventListener("keydown",e=>{
  K[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyX","KeyC","Space","KeyB"].includes(e.code))e.preventDefault();
  if(e.code==="KeyB"&&stage===0)doBossSkip();
});
window.addEventListener("keyup",e=>{ K[e.code]=false; });

/* ═══════════════════════════════
   UTILS
═══════════════════════════════ */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const ang=(ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);
function rOvlp(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function cRHit(cx,cy,cr,rx,ry,rw,rh){const tx=clamp(cx,rx,rx+rw),ty=clamp(cy,ry,ry+rh);return(cx-tx)**2+(cy-ty)**2<=cr*cr;}

/* ═══════════════════════════════
   STATE
═══════════════════════════════ */
let score=0,medals=0,gameOver=false,lastT=0,phaseT=0;
let stage=0,warnT=0,warnB=0;
const BOSS_AT=4*60, WARN_DUR=4;

const G={
  player:{x:VW/2-20,y:VH-110,w:40,h:56,spd:280,lMult:0.5,lives:3,inv:0,fire:0,hbr:5},
  pShots:[],eBullets:[],enemies:[],expl:[],medals:[],
  boss:null, spawnT:1.5, waveIdx:0, killN:0
};

function scrollLayers(dt){
  for(const l of LAYERS) l.scroll += bgBase * l.speedMult * dt;
}

/* ═══════════════════════════════
   WAVES
═══════════════════════════════ */
const WAVES=[
  {t:"small",n:3},{t:"small",n:5},{t:"medA",n:2},{t:"small",n:3},
  {t:"medB",n:1},{t:"small",n:5},{t:"medC",n:2},{t:"medA",n:2},
  {t:"small",n:3},{t:"medB",n:1},{t:"medA",n:3},{t:"medC",n:2},
  {t:"small",n:5},{t:"medB",n:2},{t:"medC",n:3},{t:"medA",n:2},
];
function nextWave(){
  if(stage!==0)return;
  const w=WAVES[G.waveIdx%WAVES.length]; G.waveIdx++;
  const baseY=60+Math.random()*200, sp=w.t==="small"?34:44, ctr=(w.n-1)/2;
  for(let i=0;i<w.n;i++){
    const oY=(i-ctr)*sp+(Math.random()*14-7), off=i*(w.t==="small"?0.15:0.22);
    if     (w.t==="small")G.enemies.push(mkSmall(baseY+oY,off));
    else if(w.t==="medA") G.enemies.push(mkMedA(baseY+oY,off));
    else if(w.t==="medB") G.enemies.push(mkMedB(off));
    else if(w.t==="medC") G.enemies.push(mkMedC(baseY+oY,off));
  }
}

/* ═══════════════════════════════
   ENEMY FACTORIES
═══════════════════════════════ */
function mkSmall(baseY,tOff){
  const fr=Math.random()<0.5;
  return{kind:"small",phase:0,tOff,fr,baseY,x:fr?VW+50:-50,drawY:baseY,
    w:36,h:36,hp:1,hpMax:1,alive:true,hitFlash:0,
    sTimer:0.7+Math.random()*0.5,sFired:0,sMax:4};
}
function mkMedA(baseY,tOff){
  return{kind:"medA",t:-tOff,dur:4.5+Math.random()*0.8,baseY,x:VW+40,drawY:baseY,
    w:44,h:44,hp:4,hpMax:4,alive:true,hitFlash:0,
    sTimer:0.8+Math.random()*0.5,sFired:0,sMax:6};
}
function mkMedB(tOff){
  return{kind:"medB",phase:"enter",t:-tOff,x:80+Math.random()*(VW-200),y:-60,drawY:-60,
    w:48,h:48,targetY:80+Math.random()*140,hp:7,hpMax:7,alive:true,hitFlash:0,
    iTimer:3.5+Math.random()*2,sTimer:0.5,bCnt:0,bMax:3,
    rot:0,rotSpd:0.8+Math.random()*0.5};
}
function mkMedC(baseY,tOff){
  return{kind:"medC",t:-tOff,ox:VW/2,oy:baseY,x:VW/2,drawY:baseY,
    w:42,h:42,hp:5,hpMax:5,alive:true,hitFlash:0,
    sTimer:0.55+Math.random()*0.3,lTimer:6+Math.random()*3,rot:0};
}

/* ═══════════════════════════════
   BULLETS
═══════════════════════════════ */
function mkBul(x,y,vx,vy){G.eBullets.push({x,y,vx,vy,w:10,h:10,alive:true});}
function shootAim(x,y,spd){const a=ang(x,y,G.player.x+G.player.w/2,G.player.y+G.player.h/2);mkBul(x,y,Math.cos(a)*spd,Math.sin(a)*spd);}
function shootSpray(x,y,n,spread,spd){const base=ang(x,y,G.player.x+G.player.w/2,G.player.y+G.player.h/2);for(let i=0;i<n;i++){const a=base-spread/2+(i/(n-1))*spread;mkBul(x,y,Math.cos(a)*spd,Math.sin(a)*spd);}}
function shootRing(x,y,n,spd,offset){const off=offset||0;for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+off;mkBul(x,y,Math.cos(a)*spd,Math.sin(a)*spd);}}
function shootDown(x,y,spd){mkBul(x,y,0,spd);}

/* ═══════════════════════════════
   ENEMY UPDATE
═══════════════════════════════ */
function updEnemies(dt){
  for(const e of G.enemies){
    if(!e.alive)continue;
    if(e.hitFlash>0)e.hitFlash-=dt;
    if     (e.kind==="small")updSmall(e,dt);
    else if(e.kind==="medA") updMedA(e,dt);
    else if(e.kind==="medB") updMedB(e,dt);
    else if(e.kind==="medC") updMedC(e,dt);
  }
  G.enemies=G.enemies.filter(e=>e.alive);
}

const SMALL_DUR=7.0, SMALL_AMP=240;
function updSmall(e,dt){
  e.phase=(e.phase||0)+dt/SMALL_DUR;
  const pp=clamp(e.phase,0,1);
  e.x=(e.fr?VW+50:-50)+((e.fr?-50:VW+50)-(e.fr?VW+50:-50))*pp;
  e.drawY=e.baseY-SMALL_AMP*Math.sin(pp*Math.PI);
  if(pp>0.15&&pp<0.85&&e.sFired<e.sMax){
    e.sTimer-=dt;
    if(e.sTimer<=0){shootAim(e.x+e.w/2,e.drawY+e.h/2,160);e.sFired++;e.sTimer=0.55+Math.random()*0.4;}
  }
  if(pp>=1.0)e.alive=false;
}
function updMedA(e,dt){
  e.t+=dt/e.dur; const t=clamp(e.t,0,1);
  e.x=VW+40-(VW+80)*e.t; e.drawY=e.baseY+Math.sin(t*Math.PI*2)*70;
  if(e.t>0.1&&e.t<0.9&&e.sFired<e.sMax){
    e.sTimer-=dt;
    if(e.sTimer<=0){shootAim(e.x+e.w/2,e.drawY+e.h/2,180);mkBul(e.x+e.w/2,e.drawY+e.h/2,-50,150);e.sFired++;e.sTimer=0.5+Math.random()*0.35;}
  }
  if(e.t>=1.05)e.alive=false;
}
function updMedB(e,dt){
  e.rot+=e.rotSpd*dt; const cx=e.x+e.w/2,cy=e.drawY+e.h/2;
  switch(e.phase){
    case"enter":e.y+=100*dt;e.drawY=e.y;if(e.y>=e.targetY){e.y=e.targetY;e.drawY=e.y;e.phase="idle";}break;
    case"idle":
      e.drawY=e.y;e.iTimer-=dt;e.sTimer-=dt;
      if(e.sTimer<=0){
        if(e.bCnt<e.bMax){shootAim(cx,cy,155);e.bCnt++;e.sTimer=0.18;}
        else{e.bCnt=0;e.sTimer=1.2+Math.random()*0.5;if(Math.random()<0.45)shootRing(cx,cy,8,105);}
      }
      if(e.iTimer<=0)e.phase="leave";break;
    case"leave":e.y-=110*dt;e.drawY=e.y;if(e.y<-70)e.alive=false;break;
  }
}
function updMedC(e,dt){
  e.t+=dt*0.65;e.lTimer-=dt;e.rot+=dt*2;
  const a=e.t,den=1+Math.sin(a)*Math.sin(a);
  e.x=e.ox+(VW*0.28*Math.cos(a))/den; e.drawY=e.oy+(VW*0.14*Math.sin(a)*Math.cos(a))/den;
  e.sTimer-=dt;
  if(e.sTimer<=0){shootSpray(e.x+e.w/2,e.drawY+e.h/2,5,Math.PI*0.5,150);e.sTimer=0.55+Math.random()*0.3;}
  if(e.lTimer<=0)e.alive=false;
}

/* ═══════════════════════════════
   BOSS
═══════════════════════════════ */
function doBossSkip(){G.enemies=[];G.eBullets=[];stage=1;}

function spawnBoss(){
  G.boss={
    x:VW/2-100,y:-230,w:200,h:210,
    hp:1000,hpMax:1000,alive:true,entering:true,targetY:20,hitFlash:0,
    vx:0,mDir:1,mT:0,baseY:20,yOffset:0,yTarget:0,yTimer:0,
    cannonIdx:0,cannonTimer:99,diamondTimer:0,
    laserActive:false,laserTimer:0,laserVx:0,
    cycleTimer:0,cyclePhase:"cannon"
  };
  document.getElementById("boss-hp-wrap").style.display="block";
}

function updBoss(dt){
  const b=G.boss; if(!b||!b.alive)return;
  if(b.hitFlash>0)b.hitFlash-=dt;
  if(b.entering){
    b.y+=70*dt; if(b.y>=b.targetY){b.y=b.targetY;b.entering=false;b.baseY=b.targetY;b.cannonTimer=2;}
    return;
  }
  if(b.laserActive){
    b.laserVx=clamp(b.laserVx+(b.mDir*180*dt),-160,160);
    if(b.x<=10||b.x>=VW-b.w-10){b.mDir=-b.mDir;b.laserVx*=-1;}
    b.x=clamp(b.x+b.laserVx*dt,10,VW-b.w-10);
  } else {
    b.mT-=dt;
    if(b.mT<=0){b.vx=b.mDir*(22+Math.random()*18);b.mDir=-b.mDir;b.mT=1.8+Math.random()*1.2;}
    b.x=clamp(b.x+b.vx*dt,10,VW-b.w-10);
  }
  b.yTimer-=dt;
  if(b.yTimer<=0){b.yTarget=(Math.random()-0.5)*70;b.yTimer=2.5+Math.random()*2.5;}
  b.yOffset+=(b.yTarget-b.yOffset)*1.2*dt;
  b.y=b.baseY+b.yOffset;
  const bx=b.x,by=b.y,bw=b.w,bh=b.h;
  const cannons=[
    {x:bx+bw*0.22,y:by+bh*0.12},{x:bx+bw*0.78,y:by+bh*0.12},
    {x:bx+bw*0.18,y:by+bh*0.62},{x:bx+bw*0.82,y:by+bh*0.62}
  ];
  const diamonds=[
    {x:bx+bw*0.38,y:by+bh*0.32},{x:bx+bw*0.62,y:by+bh*0.32},
    {x:bx+bw*0.38,y:by+bh*0.68},{x:bx+bw*0.62,y:by+bh*0.68}
  ];
  if(b.cyclePhase==="cannon"){
    b.cycleTimer+=dt;
    b.diamondTimer-=dt;
    if(b.diamondTimer<=0){for(const d of diamonds)shootDown(d.x,d.y,80+Math.random()*60);b.diamondTimer=1.1+Math.random()*0.5;}
    b.cannonTimer-=dt;
    if(b.cannonTimer<=0&&b.cannonIdx<4){
      const c=cannons[b.cannonIdx];
      shootRing(c.x,c.y,6,185,0);
      setTimeout(()=>{if(!b||!b.alive)return;shootRing(c.x,c.y,6,185,Math.PI/6);},350);
      b.cannonIdx++;b.cannonTimer=1.2;
    }
    if(b.cannonIdx>=4&&b.cycleTimer>=b.cannonIdx*1.2+2){
      b.laserActive=true;b.laserTimer=5.0;b.laserVx=b.mDir*25;b.cyclePhase="laser";
    }
  } else if(b.cyclePhase==="laser"){
    b.laserTimer-=dt;
    const lx=b.x+b.w/2,p=G.player;
    if(p.inv<=0&&Math.abs(p.x+p.w/2-lx)<20)dmgPlayer();
    if(b.laserTimer<=0){
      b.laserActive=false;b.laserVx=0;b.cyclePhase="cannon";b.cycleTimer=0;b.cannonIdx=0;b.cannonTimer=1.5;b.diamondTimer=0.5;
    }
  }
  if(b.hp<=0){
    b.alive=false;
    for(let i=0;i<22;i++)setTimeout(()=>expl(b.x+Math.random()*b.w,b.y+Math.random()*b.h,
      ["#ff4400","#ffcc00","#fff","#0ff","#a0f"][Math.floor(Math.random()*5)]),i*110);
    score+=80000;stage=4;
    document.getElementById("boss-hp-wrap").style.display="none";
  }
  document.getElementById("ui-bosshp").textContent=Math.max(0,Math.ceil(b.hp));
}
function hitBoss(s){
  const b=G.boss;if(!b||!b.alive||b.entering)return false;
  const lw=rdy(gc.laser)?gc.laser.width:16;
  const sr=s.type==="shot"?{x:s.x,y:s.y,w:s.w,h:s.h}:{x:s.px+s.pw/2-lw/2,y:0,w:lw,h:s.py};
  if(!rOvlp(sr,{x:b.x,y:b.y,w:b.w,h:b.h}))return false;
  const dmg=s.type==="laser"?3:1;
  b.hp=Math.max(0,b.hp-dmg);b.hitFlash=0.10;
  if(s.type==="shot")s.alive=false;
  return true;
}

/* ═══════════════════════════════
   MEDALS
═══════════════════════════════ */
function spawnMedal(x,y){G.medals.push({x,y,vx:(Math.random()-0.5)*60,vy:35+Math.random()*35,att:false,alive:true,a:Math.random()*Math.PI*2});}
function updMedals(dt){
  const px=G.player.x+G.player.w/2,py=G.player.y+G.player.h/2;
  for(const m of G.medals){
    if(!m.alive)continue;m.a+=dt*3;
    const d=dist(m.x,m.y,px,py);
    if(d<90||m.att){m.att=true;const a=ang(m.x,m.y,px,py);m.vx+=Math.cos(a)*380*dt;m.vy+=Math.sin(a)*380*dt;}
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(m.att&&d<14){m.alive=false;medals++;score+=500;expl(m.x,m.y,"#ffdd00");}
    if(m.y>VH+30)m.alive=false;
  }
  G.medals=G.medals.filter(m=>m.alive);
}

/* ═══════════════════════════════
   COLLISIONS
═══════════════════════════════ */
function collisions(){
  const p=G.player;
  for(const s of G.pShots){
    if(!s.alive)continue;
    if(G.boss&&G.boss.alive){hitBoss(s);}
    if(!s.alive)continue;
    for(const e of G.enemies){
      if(!e.alive)continue;
      const er={x:e.x,y:e.drawY,w:e.w,h:e.h};
      const lw=rdy(gc.laser)?gc.laser.width:16;
      const hit=s.type==="shot"?rOvlp({x:s.x,y:s.y,w:s.w,h:s.h},er):rOvlp({x:s.px+s.pw/2-lw/2,y:0,w:lw,h:s.py},er);
      if(hit){
        const dmg=s.type==="laser"?2:1;
        e.hp-=dmg;e.hitFlash=0.10;
        if(s.type==="shot")s.alive=false;
        if(e.hp<=0){
          e.alive=false;
          expl(e.x+e.w/2,e.drawY+e.h/2,e.kind==="small"?"#ffcc66":e.kind==="medA"?"#ffaa00":e.kind==="medB"?"#cc44ff":"#00ccff");
          score+=(e.kind==="small"?100:e.kind==="medA"?300:e.kind==="medB"?500:400);
          G.killN++;if(G.killN>=5){G.killN=0;spawnMedal(e.x+e.w/2,e.drawY+e.h/2);}
        }
        if(s.type==="shot")break;
      }
    }
  }
  G.pShots=G.pShots.filter(s=>s.alive);
  if(p.inv<=0){
    for(const b of G.eBullets){
      if(!b.alive)continue;
      if(cRHit(p.x+p.w/2,p.y+p.h/2,p.hbr,b.x,b.y,b.w,b.h)){b.alive=false;dmgPlayer();break;}
    }
    for(const e of G.enemies){
      if(!e.alive)continue;
      if(rOvlp({x:p.x+12,y:p.y+12,w:p.w-24,h:p.h-24},{x:e.x,y:e.drawY,w:e.w,h:e.h})){e.alive=false;expl(e.x+e.w/2,e.drawY+e.h/2,"#ff9966");dmgPlayer();}
    }
  }
}
function dmgPlayer(){const p=G.player;p.lives--;p.inv=1.8;expl(p.x+p.w/2,p.y+p.h/2,"#6699ff");p.x=VW/2-p.w/2;p.y=VH-110;if(p.lives<=0)gameOver=true;}
function expl(x,y,col){G.expl.push({x,y,r:4,mr:28,r2:2,mr2:16,life:.32,ml:.32,col:col||"#ffb347"});}

/* ═══════════════════════════════
   MAIN LOOP
═══════════════════════════════ */
let dt_last=0; // dt acumulado para estrelas mesmo no loading
function update(dt){
  if(gameOver)return;
  phaseT+=dt;
  switch(stage){
    case 0:bgBase=BG_BASE_NORMAL;scrollLayers(dt);G.spawnT-=dt;if(G.spawnT<=0){nextWave();G.spawnT=1.6+Math.random()*1.2;}if(phaseT>=BOSS_AT)doBossSkip();break;
    case 1:bgBase=Math.min(BG_BASE_FAST,bgBase+(BG_BASE_FAST-BG_BASE_NORMAL)/3*dt*5);scrollLayers(dt);if(bgBase>=BG_BASE_FAST-0.5){bgBase=BG_BASE_FAST;stage=2;warnT=WARN_DUR;}break;
    case 2:scrollLayers(dt);warnT-=dt;warnB+=dt*5;if(warnT<=0){stage=3;spawnBoss();}break;
    case 3:scrollLayers(dt);updBoss(dt);break;
    case 4:scrollLayers(dt);break;
  }
  updPlayer(dt);updShots(dt);updEnemies(dt);
  for(const b of G.eBullets){if(!b.alive)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-20||b.x>VW+20||b.y<-20||b.y>VH+20)b.alive=false;}
  G.eBullets=G.eBullets.filter(b=>b.alive);
  for(const e of G.expl){e.life-=dt;e.r+=(e.mr-e.r)*14*dt;e.r2+=(e.mr2-e.r2)*10*dt;}
  G.expl=G.expl.filter(e=>e.life>0);
  updMedals(dt);collisions();
  if(G.player.inv>0)G.player.inv-=dt;
  updHUD();
}
function updPlayer(dt){
  const p=G.player,laser=K["KeyC"],spd=laser?p.spd*p.lMult:p.spd;
  let mx=0,my=0;
  if(K["ArrowLeft"])mx-=1;if(K["ArrowRight"])mx+=1;if(K["ArrowUp"])my-=1;if(K["ArrowDown"])my+=1;
  if(mx&&my){mx*=Math.SQRT2/2;my*=Math.SQRT2/2;}
  p.x=clamp(p.x+mx*spd*dt,8,VW-p.w-8);p.y=clamp(p.y+my*spd*dt,8,VH-p.h-8);
  p.fire-=dt;
  if(laser){if(p.fire<=0){G.pShots.push({type:"laser",px:p.x,py:p.y,pw:p.w,alive:true,ttl:.05});p.fire=.04;}}
  else if(K["KeyX"]){if(p.fire<=0){G.pShots.push({type:"shot",x:p.x+p.w/2-6,y:p.y-10,w:12,h:20,vy:-580,alive:true});p.fire=.075;}}
}
function updShots(dt){
  for(const s of G.pShots){if(!s.alive)continue;if(s.type==="shot"){s.y+=s.vy*dt;if(s.y+s.h<0)s.alive=false;}else{s.ttl-=dt;if(s.ttl<=0||!K["KeyC"])s.alive=false;}}
  G.pShots=G.pShots.filter(s=>s.alive);
}
function updHUD(){
  document.getElementById("ui-score").textContent=String(score).padStart(6,"0");
  document.getElementById("ui-medals").textContent=medals;
  const el=document.getElementById("ui-lives");
  if(parseInt(el.dataset.l||"99")!==G.player.lives){
    el.dataset.l=G.player.lives;el.innerHTML="";
    for(let i=0;i<G.player.lives;i++){const p=document.createElement("div");p.className="life-pip";el.appendChild(p);}
  }
}

/* ═══════════════════════════════
   RENDER
═══════════════════════════════ */
function drawBG(dt){
  ctx.fillStyle="#000";ctx.fillRect(0,0,VW,VH);
  for(const l of LAYERS){
    if(!l.ready||l.img.naturalWidth===0)continue;
    const sc=VW/l.img.naturalWidth, h=l.img.naturalHeight*sc;
    if(h===0)continue;
    const y=l.scroll%h;
    ctx.drawImage(l.img,0,y,VW,h);
    ctx.drawImage(l.img,0,y-h,VW,h);
  }
  // Estrelas por cima das camadas de BG, abaixo de tudo mais
  drawStars(dt);
}

function drawPlayer(){
  const p=G.player;
  if(p.inv>0&&Math.floor(p.inv*14)%2===0)return;
  spr(gc.player,p.x,p.y,p.w,p.h);
  ctx.save();ctx.fillStyle="rgba(255,50,50,.95)";ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2,p.hbr,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawShots(){
  const lW=rdy(gc.laser)?gc.laser.width:16,lH=rdy(gc.laser)?gc.laser.height:16;
  for(const s of G.pShots){
    if(s.type==="shot"){spr(gc.shot,s.x,s.y,s.w,s.h);}
    else{
      const lx=Math.round(s.px+s.pw/2-lW/2),yE=Math.round(s.py+10);
      ctx.save();ctx.globalAlpha=.25;ctx.fillStyle="#0ff";ctx.fillRect(lx-8,0,lW+16,yE);ctx.restore();
      let ty=0;while(ty<yE){const th=Math.min(lH,yE-ty);if(rdy(gc.laser))ctx.drawImage(gc.laser,0,0,gc.laser.width,Math.round((th/lH)*gc.laser.height),lx,ty,lW,th);else{ctx.fillStyle="#0ff";ctx.fillRect(lx,ty,lW,th);}ty+=lH;}
    }
  }
}
function drawEnemies(){
  for(const e of G.enemies){
    if(!e.alive)continue;
    const flash=e.hitFlash>0&&Math.floor(e.hitFlash/0.035)%2===0;
    const drawNormal=()=>{
      if     (e.kind==="small")spr(gc.enemy, e.x,e.drawY,e.w,e.h);
      else if(e.kind==="medB") spr(gc.enemy2,e.x,e.drawY,e.w,e.h);
      else if(e.kind==="medC") spr(gc.enemy3,e.x,e.drawY,e.w,e.h); // Enemy3.gif
      else if(e.kind==="medA"){
        ctx.save();ctx.translate(e.x+e.w/2,e.drawY+e.h/2);ctx.fillStyle="#ffdd00";ctx.strokeStyle="#ff8800";ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(0,e.h/2);ctx.lineTo(-e.w/2,-e.h/2);ctx.lineTo(e.w/2,-e.h/2);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle="#ff4400";ctx.beginPath();ctx.arc(0,0,e.w*.18,0,Math.PI*2);ctx.fill();ctx.restore();
      }
    };
    if(flash){
      drawNormal();
      ctx.save();ctx.globalAlpha=0.28;ctx.fillStyle="#fff";ctx.fillRect(e.x,e.drawY,e.w,e.h);ctx.restore();
    } else {
      if(e.kind==="small")      spr(gc.enemy, e.x,e.drawY,e.w,e.h);
      else if(e.kind==="medB")  spr(gc.enemy2,e.x,e.drawY,e.w,e.h);
      else if(e.kind==="medC")  spr(gc.enemy3,e.x,e.drawY,e.w,e.h); // Enemy3.gif
      else if(e.kind==="medA"){
        ctx.save();ctx.translate(e.x+e.w/2,e.drawY+e.h/2);ctx.fillStyle="#ffdd00";ctx.strokeStyle="#ff8800";ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(0,e.h/2);ctx.lineTo(-e.w/2,-e.h/2);ctx.lineTo(e.w/2,-e.h/2);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle="#ff4400";ctx.beginPath();ctx.arc(0,0,e.w*.18,0,Math.PI*2);ctx.fill();ctx.restore();
      }
    }
  }
}
function drawBullets(){for(const b of G.eBullets){if(!b.alive)continue;spr(gc.bullet,b.x,b.y,b.w,b.h);}}
function drawExpl(){
  for(const e of G.expl){
    const a=clamp(e.life/e.ml,0,1);
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(255,255,255,${a*.6})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(e.x,e.y,e.r2,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
}
function drawMedals(){
  for(const m of G.medals){if(!m.alive)continue;ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.a);const r=m.att?9:7;ctx.fillStyle="#ffdd00";ctx.strokeStyle="#ff8800";ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2-Math.PI/2,rd=i%2===0?r:r*.45;i===0?ctx.moveTo(Math.cos(a)*rd,Math.sin(a)*rd):ctx.lineTo(Math.cos(a)*rd,Math.sin(a)*rd);}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
}
function drawBossHPBar(b){
  const barX=10,barY=8,barW=VW-20,barH=10,pct=b.hp/b.hpMax;
  ctx.fillStyle="rgba(0,0,0,0.7)";ctx.fillRect(barX-2,barY-2,barW+4,barH+4);
  ctx.fillStyle="#1a1a1a";ctx.fillRect(barX,barY,barW,barH);
  const grad=ctx.createLinearGradient(barX,0,barX+barW,0);
  grad.addColorStop(0,"#ff2200");grad.addColorStop(0.5,"#ff8800");grad.addColorStop(1,"#ffdd00");
  ctx.fillStyle=grad;ctx.fillRect(barX,barY,barW*pct,barH);
  ctx.strokeStyle="#666";ctx.lineWidth=1;ctx.strokeRect(barX,barY,barW,barH);
  ctx.fillStyle="#aaa";ctx.font="bold 8px monospace";ctx.textAlign="left";ctx.fillText("BOSS",barX,barY-2);
}
function drawBoss(b){
  const cx=b.x+b.w/2;
  if(b.laserActive){
    const pulse=0.6+0.4*Math.sin(Date.now()*0.015),laserW=18+Math.floor(pulse*8);
    ctx.save();ctx.shadowColor="#00ff44";ctx.shadowBlur=30;ctx.fillStyle=`rgba(0,255,68,${pulse*0.22})`;ctx.fillRect(cx-laserW*2,b.y+b.h*0.5,laserW*4,VH);ctx.restore();
    ctx.save();ctx.shadowColor="#aaffbb";ctx.shadowBlur=16;ctx.fillStyle=`rgba(180,255,200,${0.7+pulse*0.3})`;ctx.fillRect(cx-laserW/2,b.y+b.h*0.5,laserW,VH);ctx.fillStyle=`rgba(255,255,255,${pulse*0.6})`;ctx.fillRect(cx-laserW/4,b.y+b.h*0.5,laserW/2,VH);ctx.restore();
  }
  if(b.hitFlash>0&&Math.floor(b.hitFlash/0.04)%2===0)sprFlash(gc.boss,b.x,b.y,b.w,b.h,0.28);
  else spr(gc.boss,b.x,b.y,b.w,b.h);
  drawBossHPBar(b);
}
function drawWarning(){
  if(stage!==2)return;if(Math.sin(warnB*Math.PI)<=0)return;
  ctx.save();ctx.fillStyle="rgba(200,0,0,.45)";ctx.fillRect(0,VH/2-54,VW,108);
  ctx.textAlign="center";ctx.font="bold 24px monospace";ctx.strokeStyle="#f00";ctx.lineWidth=3;
  ctx.strokeText("⚠ PERIGO! PERIGO! ⚠",VW/2,VH/2-14);ctx.fillStyle="#fff";ctx.fillText("⚠ PERIGO! PERIGO! ⚠",VW/2,VH/2-14);
  ctx.font="bold 12px monospace";ctx.strokeText("NAVE MASSIVA SE APROXIMANDO RAPIDAMENTE!!",VW/2,VH/2+16);ctx.fillText("NAVE MASSIVA SE APROXIMANDO RAPIDAMENTE!!",VW/2,VH/2+16);
  ctx.textAlign="left";ctx.restore();
}
function drawWin(){ctx.save();ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(40,VH/2-60,VW-80,110);ctx.textAlign="center";ctx.fillStyle="#ffdd00";ctx.font="28px monospace";ctx.fillText("FASE COMPLETA!",VW/2,VH/2-10);ctx.fillStyle="#fff";ctx.font="13px monospace";ctx.fillText("Score: "+score,VW/2,VH/2+22);ctx.textAlign="left";ctx.restore();}
function drawGO(){ctx.save();ctx.fillStyle="rgba(0,0,0,.8)";ctx.fillRect(40,VH/2-70,VW-80,130);ctx.textAlign="center";ctx.fillStyle="#f44";ctx.font="28px monospace";ctx.fillText("GAME OVER",VW/2,VH/2-14);ctx.fillStyle="#aaa";ctx.font="12px monospace";ctx.fillText("Recarregue para jogar novamente",VW/2,VH/2+20);ctx.textAlign="left";ctx.restore();}
function drawLoading(dt){
  ctx.clearRect(0,0,VW,VH);ctx.fillStyle="#000";ctx.fillRect(0,0,VW,VH);
  drawStars(dt); // estrelas aparecem já na tela de loading
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="16px monospace";ctx.fillText("Carregando...",VW/2,VH/2-10);
  ctx.fillStyle="#555";ctx.font="12px monospace";ctx.fillText(loaded+" / 12",VW/2,VH/2+16);ctx.textAlign="left";
}

function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.033);lastT=ts;
  update(dt);
  ctx.clearRect(0,0,VW,VH);
  drawBG(dt);
  drawMedals();drawShots();drawEnemies();
  if(G.boss&&G.boss.alive)drawBoss(G.boss);
  drawBullets();drawExpl();drawPlayer();drawWarning();
  if(stage===4)drawWin();if(gameOver)drawGO();
  requestAnimationFrame(loop);
}

function startGame(){updHUD();requestAnimationFrame(loop);}
(function loading(){
  if(loaded>=12)return;
  const now=performance.now();
  const dt2=Math.min((now-lastT)/1000,0.033);lastT=now;
  drawLoading(dt2);
  requestAnimationFrame(loading);
})();
</script>
</body>
