<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Shmup Vertical - Fase 01</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:monospace;color:#fff;}
    #shell{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:center;}
    #hud-left,#hud-right{flex:1;display:flex;flex-direction:column;padding:8px 6px;gap:6px;background:#111;min-width:0;overflow:hidden;}
    #hud-left{align-items:flex-end;border-right:1px solid #222;}
    #hud-right{align-items:flex-start;border-left:1px solid #222;}
    #canvas-wrap{flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#000;}
    canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
    #gif-pool{position:fixed;left:-9999px;top:0;pointer-events:none;}
    .hud-label{font-size:9px;color:#666;text-transform:uppercase;letter-spacing:1px;}
    .hud-value{font-size:16px;color:#fff;line-height:1.1;}
    .life-pip{width:8px;height:8px;background:#ff4444;border-radius:50%;margin:1px 0;}
  </style>
</head>
<body>
<div id="shell">
  <div id="hud-left">
    <div><div class="hud-label">Score</div><div class="hud-value" id="ui-score">000000</div></div>
    <div><div class="hud-label">Vidas</div><div id="ui-lives"></div></div>
    <div><div class="hud-label">Fase</div><div class="hud-value">01</div></div>
    <div><div class="hud-label">Medalhas</div><div class="hud-value" id="ui-medals">0</div></div>
    <div><div class="hud-label">Rank</div><div class="hud-value" id="ui-rank">C</div></div>
    <div id="boss-hp-wrap" style="display:none">
      <div class="hud-label">Boss HP</div>
      <div class="hud-value" id="ui-bosshp" style="color:#f44">---</div>
    </div>
    <div style="margin-top:auto">
      <div class="hud-label" style="color:#333;font-size:8px;">←→↑↓ mover<br>X atirar<br>C laser<br>B boss</div>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game" width="480" height="640"></canvas>
  </div>
  <div id="hud-right"></div>
</div>
<div id="gif-pool">
  <canvas id="gc-player"></canvas><canvas id="gc-shot"></canvas>
  <canvas id="gc-laser"></canvas><canvas id="gc-enemy"></canvas>
  <canvas id="gc-enemy2"></canvas><canvas id="gc-enemy3"></canvas>
  <canvas id="gc-bullet"></canvas><canvas id="gc-boss"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/gifler@0.1.0/gifler.min.js"></script>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const wrap=document.getElementById("canvas-wrap");
const VW=480,VH=640;
ctx.imageSmoothingEnabled=false;

function resize(){
  const availW=wrap.clientWidth||window.innerWidth*0.6;
  const availH=wrap.clientHeight||window.innerHeight;
  const s=Math.max(1,Math.min(Math.floor(availW/VW),Math.floor(availH/VH)));
  canvas.style.width=(VW*s)+"px";canvas.style.height=(VH*s)+"px";
}
window.addEventListener("resize",resize);
requestAnimationFrame(()=>{resize();requestAnimationFrame(resize);});

/* ══════════════════════════
   BG — cinco camadas em loop
   integer scale, centralizada
══════════════════════════ */
const bgLayers=[
  {src:"bg/bg-fase-01.png",  speed:20,  img:new Image(), scroll:0},
  {src:"bg/bg-fase-01a.png", speed:45,  img:new Image(), scroll:0},
  {src:"bg/bg-fase-01b.png", speed:70,  img:new Image(), scroll:0},
  {src:"bg/bg-fase-01c.png", speed:100, img:new Image(), scroll:0},
  {src:"bg/bg-fase-01d.png", speed:24,  img:new Image(), scroll:0},
];
let bgReady=0;
bgLayers.forEach(l=>{
  l.img.onload=()=>{bgReady++;console.log(`BG OK [${bgReady}/5]: ${l.src}`);checkStart();};
  l.img.onerror=()=>{bgReady++;console.error(`BG ERRO: ${l.src}`);checkStart();};
  l.img.src=l.src;
});

function drawLayer(img,scroll,dt,speed){
  if(!img||img.naturalWidth===0)return scroll;
  const scale=Math.max(1,Math.floor(VW/img.naturalWidth));
  const dw=img.naturalWidth*scale;
  const dh=img.naturalHeight*scale;
  const dx=Math.floor((VW-dw)/2);
  scroll=(scroll+speed*dt)%dh;
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(img,dx,scroll,dw,dh);
  ctx.drawImage(img,dx,scroll-dh,dw,dh);
  return scroll;
}

function drawBG(dt){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,VW,VH);
  for(const l of bgLayers){
    l.scroll=drawLayer(l.img,l.scroll,dt,l.speed);
  }
}

/* ══════════════════════════
   SPRITES / GIFs
══════════════════════════ */
const SCALE={player:2,shot:1,bullet:2,enemy:2,enemy2:1,enemy3:2,laser:1,boss:0.5};
function sw(c,key){if(!rdy(c))return 32;const s=SCALE[key];return s<1?Math.max(1,Math.floor(c.width*s)):c.width*s;}
function sh(c,key){if(!rdy(c))return 32;const s=SCALE[key];return s<1?Math.max(1,Math.floor(c.height*s)):c.height*s;}
function rdy(c){return c&&c.width>0&&c.height>0;}

const gc={
  player:document.getElementById("gc-player"),shot:document.getElementById("gc-shot"),
  laser:document.getElementById("gc-laser"),enemy:document.getElementById("gc-enemy"),
  enemy2:document.getElementById("gc-enemy2"),enemy3:document.getElementById("gc-enemy3"),
  bullet:document.getElementById("gc-bullet"),boss:document.getElementById("gc-boss"),
};
let gifReady=0;
function onGifRdy(){gifReady++;console.log(`GIF OK [${gifReady}/8]`);checkStart();}
function loadGif(src,cvs){
  let first=true;
  gifler(src).frames(cvs,(c2,f)=>{
    cvs.width=f.width;cvs.height=f.height;
    c2.clearRect(0,0,f.width,f.height);c2.drawImage(f.buffer,0,0);
    if(first){first=false;onGifRdy();}
  },true);
}
loadGif("player.gif",gc.player);loadGif("tiro-01.gif",gc.shot);
loadGif("tiro-02.gif",gc.laser);loadGif("Enemy.gif",gc.enemy);
loadGif("Enemy2.gif",gc.enemy2);loadGif("Enemy3.gif",gc.enemy3);
loadGif("bullet.gif",gc.bullet);loadGif("Boss1.gif",gc.boss);

let gameStarted=false;
function checkStart(){
  if(bgReady>=5&&gifReady>=8&&!gameStarted){console.log("Todos prontos — startGame()");startGame();}
}

function spr(c,key,x,y){
  if(!rdy(c)){ctx.fillStyle="#f0f";ctx.fillRect(x,y,sw(c,key),sh(c,key));return;}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(c,x,y,sw(c,key),sh(c,key));
}
const flashCvs=document.createElement("canvas");
function sprFlash(c,key,x,y,alpha){
  const fw=sw(c,key),fh=sh(c,key);
  if(!rdy(c)){ctx.save();ctx.globalAlpha=alpha||0.28;ctx.fillStyle="#fff";ctx.fillRect(x,y,fw,fh);ctx.restore();return;}
  flashCvs.width=fw;flashCvs.height=fh;
  const fc=flashCvs.getContext("2d");
  fc.imageSmoothingEnabled=false;fc.clearRect(0,0,fw,fh);fc.drawImage(c,0,0,fw,fh);
  fc.globalCompositeOperation="source-atop";fc.fillStyle=`rgba(255,255,255,${alpha||0.28})`;fc.fillRect(0,0,fw,fh);
  ctx.imageSmoothingEnabled=false;ctx.drawImage(flashCvs,x,y);
}

const K={};
window.addEventListener("keydown",e=>{
  K[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyX","KeyC","Space","KeyB"].includes(e.code))e.preventDefault();
  if(e.code==="KeyB"&&stage===0)doBossSkip();
});
window.addEventListener("keyup",e=>{K[e.code]=false;});

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const ang=(ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);
function rOvlp(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function cRHit(cx,cy,cr,rx,ry,rw,rh){const tx=clamp(cx,rx,rx+rw),ty=clamp(cy,ry,ry+rh);return(cx-tx)**2+(cy-ty)**2<=cr*cr;}

let score=0,medals=0,gameOver=false,lastT=0,phaseT=0;
let stage=0,warnT=0,warnB=0;
const BOSS_AT=4*60,WARN_DUR=4;
const G={
  player:{x:VW/2-40,y:VH-120,w:80,h:80,spd:280,lMult:0.5,lives:3,inv:0,fire:0,hbr:6},
  pShots:[],eBullets:[],enemies:[],expl:[],medals:[],
  boss:null,spawnT:1.5,waveIdx:0,killN:0
};
function syncPlayerSize(){if(!rdy(gc.player))return;G.player.w=sw(gc.player,"player");G.player.h=sh(gc.player,"player");}

const WAVES=[
  {t:"small",n:3},{t:"small",n:5},{t:"medA",n:2},{t:"small",n:3},
  {t:"medB",n:1},{t:"small",n:5},{t:"medC",n:2},{t:"medA",n:2},
  {t:"small",n:3},{t:"medB",n:1},{t:"medA",n:3},{t:"medC",n:2},
  {t:"small",n:5},{t:"medB",n:2},{t:"medC",n:3},{t:"medA",n:2},
];
function nextWave(){
  if(stage!==0)return;
  const w=WAVES[G.waveIdx%WAVES.length];G.waveIdx++;
  const baseY=60+Math.random()*200,sp=48,ctr=(w.n-1)/2;
  for(let i=0;i<w.n;i++){
    const oY=(i-ctr)*sp+(Math.random()*14-7),off=i*(w.t==="small"?0.15:0.22);
    if(w.t==="small")G.enemies.push(mkSmall(baseY+oY,off));
    else if(w.t==="medA")G.enemies.push(mkMedA(baseY+oY,off));
    else if(w.t==="medB")G.enemies.push(mkMedB(off));
    else if(w.t==="medC")G.enemies.push(mkMedC(baseY+oY,off));
  }
}

function mkSmall(baseY,tOff){const fr=Math.random()<0.5,w=sw(gc.enemy,"enemy"),h=sh(gc.enemy,"enemy");return{kind:"small",phase:0,tOff,fr,baseY,x:fr?VW+50:-50,drawY:baseY,w,h,hp:1,hpMax:1,alive:true,hitFlash:0,sTimer:0.7+Math.random()*0.5,sFired:0,sMax:4};}
function mkMedA(baseY,tOff){return{kind:"medA",t:-tOff,dur:4.5+Math.random()*0.8,baseY,x:VW+40,drawY:baseY,w:48,h:48,hp:4,hpMax:4,alive:true,hitFlash:0,sTimer:0.8+Math.random()*0.5,sFired:0,sMax:6};}
function mkMedB(tOff){const w=sw(gc.enemy2,"enemy2"),h=sh(gc.enemy2,"enemy2");return{kind:"medB",phase:"enter",t:-tOff,x:80+Math.random()*(VW-200),y:-60,drawY:-60,w,h,targetY:80+Math.random()*140,hp:7,hpMax:7,alive:true,hitFlash:0,iTimer:3.5+Math.random()*2,sTimer:0.5,bCnt:0,bMax:3,rot:0,rotSpd:0.8+Math.random()*0.5};}
function mkMedC(baseY,tOff){const w=sw(gc.enemy3,"enemy3"),h=sh(gc.enemy3,"enemy3");return{kind:"medC",t:-tOff,ox:VW/2,oy:baseY,x:VW/2,drawY:baseY,w,h,hp:5,hpMax:5,alive:true,hitFlash:0,sTimer:0.55+Math.random()*0.3,lTimer:6+Math.random()*3};}

function mkBul(x,y,vx,vy){const w=sw(gc.bullet,"bullet"),h=sh(gc.bullet,"bullet");G.eBullets.push({x,y,vx,vy,w,h,alive:true});}
function shootAim(x,y,spd){const a=ang(x,y,G.player.x+G.player.w/2,G.player.y+G.player.h/2);mkBul(x,y,Math.cos(a)*spd,Math.sin(a)*spd);}
function shootSpray(x,y,n,spread,spd){const base=ang(x,y,G.player.x+G.player.w/2,G.player.y+G.player.h/2);for(let i=0;i<n;i++){const a=base-spread/2+(i/(n-1))*spread;mkBul(x,y,Math.cos(a)*spd,Math.sin(a)*spd);}}
function shootRing(x,y,n,spd,offset){const off=offset||0;for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+off;mkBul(x,y,Math.cos(a)*spd,Math.sin(a)*spd);}}
function shootDown(x,y,spd){mkBul(x,y,0,spd);}

function updEnemies(dt){
  for(const e of G.enemies){
    if(!e.alive)continue;if(e.hitFlash>0)e.hitFlash-=dt;
    if(e.kind==="small")updSmall(e,dt);
    else if(e.kind==="medA")updMedA(e,dt);
    else if(e.kind==="medB")updMedB(e,dt);
    else if(e.kind==="medC")updMedC(e,dt);
  }
  G.enemies=G.enemies.filter(e=>e.alive);
}
const SMALL_DUR=7.0,SMALL_AMP=240;
function updSmall(e,dt){
  e.phase=(e.phase||0)+dt/SMALL_DUR;const pp=clamp(e.phase,0,1);
  e.x=(e.fr?VW+50:-50)+((e.fr?-50:VW+50)-(e.fr?VW+50:-50))*pp;
  e.drawY=e.baseY-SMALL_AMP*Math.sin(pp*Math.PI);
  if(pp>0.15&&pp<0.85&&e.sFired<e.sMax){e.sTimer-=dt;if(e.sTimer<=0){shootAim(e.x+e.w/2,e.drawY+e.h/2,160);e.sFired++;e.sTimer=0.55+Math.random()*0.4;}}
  if(pp>=1.0)e.alive=false;
}
function updMedA(e,dt){
  e.t+=dt/e.dur;const t=clamp(e.t,0,1);
  e.x=VW+40-(VW+80)*e.t;e.drawY=e.baseY+Math.sin(t*Math.PI*2)*70;
  if(e.t>0.1&&e.t<0.9&&e.sFired<e.sMax){e.sTimer-=dt;if(e.sTimer<=0){shootAim(e.x+e.w/2,e.drawY+e.h/2,180);mkBul(e.x+e.w/2,e.drawY+e.h/2,-50,150);e.sFired++;e.sTimer=0.5+Math.random()*0.35;}}
  if(e.t>=1.05)e.alive=false;
}
function updMedB(e,dt){
  e.rot+=e.rotSpd*dt;const cx=e.x+e.w/2,cy=e.drawY+e.h/2;
  switch(e.phase){
    case"enter":e.y+=100*dt;e.drawY=e.y;if(e.y>=e.targetY){e.y=e.targetY;e.drawY=e.y;e.phase="idle";}break;
    case"idle":
      e.drawY=e.y;e.iTimer-=dt;e.sTimer-=dt;
      if(e.sTimer<=0){if(e.bCnt<e.bMax){shootAim(cx,cy,155);e.bCnt++;e.sTimer=0.18;}else{e.bCnt=0;e.sTimer=1.2+Math.random()*0.5;if(Math.random()<0.45)shootRing(cx,cy,8,105);}}
      if(e.iTimer<=0)e.phase="leave";break;
    case"leave":e.y-=110*dt;e.drawY=e.y;if(e.y<-70)e.alive=false;break;
  }
}
function updMedC(e,dt){
  e.t+=dt*0.65;e.lTimer-=dt;
  const a=e.t,den=1+Math.sin(a)*Math.sin(a);
  e.x=e.ox+(VW*0.28*Math.cos(a))/den;e.drawY=e.oy+(VW*0.14*Math.sin(a)*Math.cos(a))/den;
  e.sTimer-=dt;if(e.sTimer<=0){shootSpray(e.x+e.w/2,e.drawY+e.h/2,5,Math.PI*0.5,150);e.sTimer=0.55+Math.random()*0.3;}
  if(e.lTimer<=0)e.alive=false;
}

function doBossSkip(){G.enemies=[];G.eBullets=[];stage=1;}
function spawnBoss(){
  const bw=sw(gc.boss,"boss"),bh=sh(gc.boss,"boss");
  G.boss={x:VW/2-bw/2,y:-bh-20,w:bw,h:bh,hp:1000,hpMax:1000,alive:true,entering:true,targetY:20,hitFlash:0,vx:0,mDir:1,mT:0,baseY:20,yOffset:0,yTarget:0,yTimer:0,cannonIdx:0,cannonTimer:99,diamondTimer:0,laserActive:false,laserTimer:0,laserVx:0,cycleTimer:0,cyclePhase:"cannon"};
  document.getElementById("boss-hp-wrap").style.display="block";
}
function updBoss(dt){
  const b=G.boss;if(!b||!b.alive)return;
  if(b.hitFlash>0)b.hitFlash-=dt;
  if(b.entering){b.y+=70*dt;if(b.y>=b.targetY){b.y=b.targetY;b.entering=false;b.baseY=b.targetY;b.cannonTimer=2;}return;}
  if(b.laserActive){
    b.laserVx=clamp(b.laserVx+(b.mDir*180*dt),-160,160);
    if(b.x<=10||b.x>=VW-b.w-10){b.mDir=-b.mDir;b.laserVx*=-1;}
    b.x=clamp(b.x+b.laserVx*dt,10,VW-b.w-10);
  }else{
    b.mT-=dt;if(b.mT<=0){b.vx=b.mDir*(22+Math.random()*18);b.mDir=-b.mDir;b.mT=1.8+Math.random()*1.2;}
    b.x=clamp(b.x+b.vx*dt,10,VW-b.w-10);
  }
  b.yTimer-=dt;if(b.yTimer<=0){b.yTarget=(Math.random()-0.5)*70;b.yTimer=2.5+Math.random()*2.5;}
  b.yOffset+=(b.yTarget-b.yOffset)*1.2*dt;b.y=b.baseY+b.yOffset;
  const bx=b.x,by=b.y,bw2=b.w,bh2=b.h;
  const cannons=[{x:bx+bw2*.22,y:by+bh2*.12},{x:bx+bw2*.78,y:by+bh2*.12},{x:bx+bw2*.18,y:by+bh2*.62},{x:bx+bw2*.82,y:by+bh2*.62}];
  const diamonds=[{x:bx+bw2*.38,y:by+bh2*.32},{x:bx+bw2*.62,y:by+bh2*.32},{x:bx+bw2*.38,y:by+bh2*.68},{x:bx+bw2*.62,y:by+bh2*.68}];
  if(b.cyclePhase==="cannon"){
    b.cycleTimer+=dt;b.diamondTimer-=dt;
    if(b.diamondTimer<=0){for(const d of diamonds)shootDown(d.x,d.y,80+Math.random()*60);b.diamondTimer=1.1+Math.random()*0.5;}
    b.cannonTimer-=dt;
    if(b.cannonTimer<=0&&b.cannonIdx<4){
      const c=cannons[b.cannonIdx];shootRing(c.x,c.y,6,185,0);
      setTimeout(()=>{if(!b||!b.alive)return;shootRing(c.x,c.y,6,185,Math.PI/6);},350);
      b.cannonIdx++;b.cannonTimer=1.2;
    }
    if(b.cannonIdx>=4&&b.cycleTimer>=b.cannonIdx*1.2+2){b.laserActive=true;b.laserTimer=5.0;b.laserVx=b.mDir*25;b.cyclePhase="laser";}
  }else{
    b.laserTimer-=dt;
    const lx=b.x+b.w/2,p=G.player;
    if(p.inv<=0&&Math.abs(p.x+p.w/2-lx)<20)dmgPlayer();
    if(b.laserTimer<=0){b.laserActive=false;b.laserVx=0;b.cyclePhase="cannon";b.cycleTimer=0;b.cannonIdx=0;b.cannonTimer=1.5;b.diamondTimer=0.5;}
  }
  if(b.hp<=0){
    b.alive=false;
    for(let i=0;i<22;i++)setTimeout(()=>expl(b.x+Math.random()*b.w,b.y+Math.random()*b.h,["#ff4400","#ffcc00","#fff","#0ff","#a0f"][Math.floor(Math.random()*5)]),i*110);
    score+=80000;stage=4;document.getElementById("boss-hp-wrap").style.display="none";
  }
  document.getElementById("ui-bosshp").textContent=Math.max(0,Math.ceil(b.hp));
}
function hitBoss(s){
  const b=G.boss;if(!b||!b.alive||b.entering)return false;
  const lw=rdy(gc.laser)?gc.laser.width*SCALE.laser:16;
  const sr=s.type==="shot"?{x:s.x,y:s.y,w:s.w,h:s.h}:{x:s.px+s.pw/2-lw/2,y:0,w:lw,h:s.py};
  if(!rOvlp(sr,{x:b.x,y:b.y,w:b.w,h:b.h}))return false;
  b.hp=Math.max(0,b.hp-(s.type==="laser"?3:1));b.hitFlash=0.10;
  if(s.type==="shot")s.alive=false;return true;
}

function spawnMedal(x,y){G.medals.push({x,y,vx:(Math.random()-0.5)*60,vy:35+Math.random()*35,att:false,alive:true,a:Math.random()*Math.PI*2});}
function updMedals(dt){
  const px=G.player.x+G.player.w/2,py=G.player.y+G.player.h/2;
  for(const m of G.medals){
    if(!m.alive)continue;m.a+=dt*3;
    const d=dist(m.x,m.y,px,py);
    if(d<90||m.att){m.att=true;const a=ang(m.x,m.y,px,py);m.vx+=Math.cos(a)*380*dt;m.vy+=Math.sin(a)*380*dt;}
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(m.att&&d<14){m.alive=false;medals++;score+=500;expl(m.x,m.y,"#ffdd00");}
    if(m.y>VH+30)m.alive=false;
  }
  G.medals=G.medals.filter(m=>m.alive);
}
function collisions(){
  const p=G.player;
  for(const s of G.pShots){
    if(!s.alive)continue;
    if(G.boss&&G.boss.alive)hitBoss(s);
    if(!s.alive)continue;
    for(const e of G.enemies){
      if(!e.alive)continue;
      const er={x:e.x,y:e.drawY,w:e.w,h:e.h};
      const lw=rdy(gc.laser)?gc.laser.width*SCALE.laser:16;
      const hit=s.type==="shot"?rOvlp({x:s.x,y:s.y,w:s.w,h:s.h},er):rOvlp({x:s.px+s.pw/2-lw/2,y:0,w:lw,h:s.py},er);
      if(hit){
        e.hp-=(s.type==="laser"?2:1);e.hitFlash=0.10;
        if(s.type==="shot")s.alive=false;
        if(e.hp<=0){
          e.alive=false;
          expl(e.x+e.w/2,e.drawY+e.h/2,e.kind==="small"?"#ffcc66":e.kind==="medA"?"#ffaa00":e.kind==="medB"?"#cc44ff":"#00ccff");
          score+=(e.kind==="small"?100:e.kind==="medA"?300:e.kind==="medB"?500:400);
          G.killN++;if(G.killN>=5){G.killN=0;spawnMedal(e.x+e.w/2,e.drawY+e.h/2);}
        }
        if(s.type==="shot")break;
      }
    }
  }
  G.pShots=G.pShots.filter(s=>s.alive);
  if(p.inv<=0){
    for(const b of G.eBullets){
      if(!b.alive)continue;
      if(cRHit(p.x+p.w/2,p.y+p.h/2,p.hbr,b.x,b.y,b.w,b.h)){b.alive=false;dmgPlayer();break;}
    }
    for(const e of G.enemies){
      if(!e.alive)continue;
      if(rOvlp({x:p.x+8,y:p.y+8,w:p.w-16,h:p.h-16},{x:e.x,y:e.drawY,w:e.w,h:e.h})){e.alive=false;expl(e.x+e.w/2,e.drawY+e.h/2,"#ff9966");dmgPlayer();}
    }
  }
}
function dmgPlayer(){const p=G.player;p.lives--;p.inv=1.8;expl(p.x+p.w/2,p.y+p.h/2,"#6699ff");p.x=VW/2-p.w/2;p.y=VH-120;if(p.lives<=0)gameOver=true;}
function expl(x,y,col){G.expl.push({x,y,r:4,mr:28,r2:2,mr2:16,life:.32,ml:.32,col:col||"#ffb347"});}

function update(dt){
  if(gameOver)return;
  phaseT+=dt;syncPlayerSize();
  switch(stage){
    case 0:G.spawnT-=dt;if(G.spawnT<=0){nextWave();G.spawnT=1.6+Math.random()*1.2;}if(phaseT>=BOSS_AT)doBossSkip();break;
    case 1:stage=2;warnT=WARN_DUR;break;
    case 2:warnT-=dt;warnB+=dt*5;if(warnT<=0){stage=3;spawnBoss();}break;
    case 3:updBoss(dt);break;
  }
  updPlayer(dt);updShots(dt);updEnemies(dt);
  for(const b of G.eBullets){if(!b.alive)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-30||b.x>VW+30||b.y<-30||b.y>VH+30)b.alive=false;}
  G.eBullets=G.eBullets.filter(b=>b.alive);
  for(const e of G.expl){e.life-=dt;e.r+=(e.mr-e.r)*14*dt;e.r2+=(e.mr2-e.r2)*10*dt;}
  G.expl=G.expl.filter(e=>e.life>0);
  updMedals(dt);collisions();
  if(G.player.inv>0)G.player.inv-=dt;
  updHUD();
}
function updPlayer(dt){
  const p=G.player,laser=K["KeyC"],spd=laser?p.spd*p.lMult:p.spd;
  let mx=0,my=0;
  if(K["ArrowLeft"])mx-=1;if(K["ArrowRight"])mx+=1;if(K["ArrowUp"])my-=1;if(K["ArrowDown"])my+=1;
  if(mx&&my){mx*=Math.SQRT2/2;my*=Math.SQRT2/2;}
  p.x=clamp(p.x+mx*spd*dt,8,VW-p.w-8);p.y=clamp(p.y+my*spd*dt,8,VH-p.h-8);
  p.fire-=dt;
  if(laser){if(p.fire<=0){G.pShots.push({type:"laser",px:p.x,py:p.y,pw:p.w,alive:true,ttl:.05});p.fire=.04;}}
  else if(K["KeyX"]){
    const sw2=sw(gc.shot,"shot"),sh2=sh(gc.shot,"shot");
    if(p.fire<=0){G.pShots.push({type:"shot",x:p.x+p.w/2-sw2/2,y:p.y-sh2,w:sw2,h:sh2,vy:-580,alive:true});p.fire=.075;}
  }
}
function updShots(dt){
  for(const s of G.pShots){if(!s.alive)continue;if(s.type==="shot"){s.y+=s.vy*dt;if(s.y+s.h<0)s.alive=false;}else{s.ttl-=dt;if(s.ttl<=0||!K["KeyC"])s.alive=false;}}
  G.pShots=G.pShots.filter(s=>s.alive);
}
function updHUD(){
  document.getElementById("ui-score").textContent=String(score).padStart(6,"0");
  document.getElementById("ui-medals").textContent=medals;
  const el=document.getElementById("ui-lives");
  if(parseInt(el.dataset.l||"99")!==G.player.lives){
    el.dataset.l=G.player.lives;el.innerHTML="";
    for(let i=0;i<G.player.lives;i++){const d=document.createElement("div");d.className="life-pip";el.appendChild(d);}
  }
}

function drawPlayer(){
  const p=G.player;
  if(p.inv>0&&Math.floor(p.inv*14)%2===0)return;
  ctx.imageSmoothingEnabled=false;spr(gc.player,"player",p.x,p.y);
}
function drawShots(){
  const lW=rdy(gc.laser)?gc.laser.width*SCALE.laser:16;
  const lH=rdy(gc.laser)?gc.laser.height*SCALE.laser:16;
  for(const s of G.pShots){
    if(s.type==="shot"){spr(gc.shot,"shot",s.x,s.y);}
    else{
      const lx=Math.round(s.px+s.pw/2-lW/2),yE=Math.round(s.py+10);
      ctx.save();ctx.globalAlpha=.25;ctx.fillStyle="#0ff";ctx.fillRect(lx-8,0,lW+16,yE);ctx.restore();
      let ty=0;while(ty<yE){const th=Math.min(lH,yE-ty);
        ctx.imageSmoothingEnabled=false;
        if(rdy(gc.laser))ctx.drawImage(gc.laser,0,0,gc.laser.width,Math.round((th/lH)*gc.laser.height),lx,ty,lW,th);
        else{ctx.fillStyle="#0ff";ctx.fillRect(lx,ty,lW,th);}ty+=lH;}
    }
  }
}
function drawEnemies(){
  for(const e of G.enemies){
    if(!e.alive)continue;
    const flash=e.hitFlash>0&&Math.floor(e.hitFlash/0.035)%2===0;
    if(e.kind==="small"){if(flash)sprFlash(gc.enemy,"enemy",e.x,e.drawY,0.28);else spr(gc.enemy,"enemy",e.x,e.drawY);}
    else if(e.kind==="medB"){if(flash)sprFlash(gc.enemy2,"enemy2",e.x,e.drawY,0.28);else spr(gc.enemy2,"enemy2",e.x,e.drawY);}
    else if(e.kind==="medC"){if(flash)sprFlash(gc.enemy3,"enemy3",e.x,e.drawY,0.28);else spr(gc.enemy3,"enemy3",e.x,e.drawY);}
    else if(e.kind==="medA"){
      ctx.save();ctx.translate(e.x+e.w/2,e.drawY+e.h/2);
      ctx.fillStyle=flash?"#ffe":"#ffdd00";ctx.strokeStyle="#ff8800";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,e.h/2);ctx.lineTo(-e.w/2,-e.h/2);ctx.lineTo(e.w/2,-e.h/2);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle="#ff4400";ctx.beginPath();ctx.arc(0,0,e.w*.18,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }
}
function drawBullets(){for(const b of G.eBullets){if(!b.alive)continue;spr(gc.bullet,"bullet",b.x,b.y);}}
function drawExpl(){
  for(const e of G.expl){
    const a=clamp(e.life/e.ml,0,1);
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(255,255,255,${a*.6})`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(e.x,e.y,e.r2,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
}
function drawMedals(){
  for(const m of G.medals){if(!m.alive)continue;ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.a);const r=m.att?9:7;ctx.fillStyle="#ffdd00";ctx.strokeStyle="#ff8800";ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){const a2=(i/10)*Math.PI*2-Math.PI/2,rd=i%2===0?r:r*.45;i===0?ctx.moveTo(Math.cos(a2)*rd,Math.sin(a2)*rd):ctx.lineTo(Math.cos(a2)*rd,Math.sin(a2)*rd);}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
}
function drawBoss(b){
  const cx=b.x+b.w/2;
  if(b.laserActive){
    const pulse=0.6+0.4*Math.sin(Date.now()*.015),laserW=18+Math.floor(pulse*8);
    ctx.save();ctx.shadowColor="#00ff44";ctx.shadowBlur=30;ctx.fillStyle=`rgba(0,255,68,${pulse*.22})`;ctx.fillRect(cx-laserW*2,b.y+b.h*.5,laserW*4,VH);ctx.restore();
    ctx.save();ctx.shadowColor="#aaffbb";ctx.shadowBlur=16;ctx.fillStyle=`rgba(180,255,200,${.7+pulse*.3})`;ctx.fillRect(cx-laserW/2,b.y+b.h*.5,laserW,VH);ctx.fillStyle=`rgba(255,255,255,${pulse*.6})`;ctx.fillRect(cx-laserW/4,b.y+b.h*.5,laserW/2,VH);ctx.restore();
  }
  if(b.hitFlash>0&&Math.floor(b.hitFlash/.04)%2===0)sprFlash(gc.boss,"boss",b.x,b.y,0.28);
  else spr(gc.boss,"boss",b.x,b.y);
  const pct=b.hp/b.hpMax,bx=8,by=4,bw=VW-16,bh=8;
  ctx.fillStyle="rgba(0,0,0,0.65)";ctx.fillRect(bx-1,by-1,bw+2,bh+2);
  ctx.fillStyle="#111";ctx.fillRect(bx,by,bw,bh);
  const gr=ctx.createLinearGradient(bx,0,bx+bw,0);
  gr.addColorStop(0,"#ff2200");gr.addColorStop(.5,"#ff8800");gr.addColorStop(1,"#ffdd00");
  ctx.fillStyle=gr;ctx.fillRect(bx,by,bw*pct,bh);
  ctx.strokeStyle="#555";ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle="#aaa";ctx.font="bold 7px monospace";ctx.textAlign="left";ctx.fillText("BOSS",bx,by-1);
}
function drawWarning(){
  if(stage!==2)return;if(Math.sin(warnB*Math.PI)<=0)return;
  ctx.save();ctx.fillStyle="rgba(200,0,0,.45)";ctx.fillRect(0,VH/2-54,VW,108);
  ctx.textAlign="center";ctx.font="bold 24px monospace";ctx.strokeStyle="#f00";ctx.lineWidth=3;
  ctx.strokeText("⚠ PERIGO! PERIGO! ⚠",VW/2,VH/2-14);ctx.fillStyle="#fff";ctx.fillText("⚠ PERIGO! PERIGO! ⚠",VW/2,VH/2-14);
  ctx.font="bold 12px monospace";ctx.strokeText("NAVE MASSIVA SE APROXIMANDO RAPIDAMENTE!!",VW/2,VH/2+16);ctx.fillText("NAVE MASSIVA SE APROXIMANDO RAPIDAMENTE!!",VW/2,VH/2+16);
  ctx.textAlign="left";ctx.restore();
}
function drawWin(){ctx.save();ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(40,VH/2-60,VW-80,110);ctx.textAlign="center";ctx.fillStyle="#ffdd00";ctx.font="28px monospace";ctx.fillText("FASE COMPLETA!",VW/2,VH/2-10);ctx.fillStyle="#fff";ctx.font="13px monospace";ctx.fillText("Score: "+score,VW/2,VH/2+22);ctx.textAlign="left";ctx.restore();}
function drawGO(){ctx.save();ctx.fillStyle="rgba(0,0,0,.8)";ctx.fillRect(40,VH/2-70,VW-80,130);ctx.textAlign="center";ctx.fillStyle="#f44";ctx.font="28px monospace";ctx.fillText("GAME OVER",VW/2,VH/2-14);ctx.fillStyle="#aaa";ctx.font="12px monospace";ctx.fillText("Recarregue para jogar novamente",VW/2,VH/2+20);ctx.textAlign="left";ctx.restore();}
function drawLoading(){
  ctx.fillStyle="#000";ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="14px monospace";
  ctx.fillText("Carregando...",VW/2,VH/2-10);
  ctx.font="11px monospace";ctx.fillStyle="#aaa";
  ctx.fillText(`GIF: ${gifReady}/8  BG: ${bgReady}/5`,VW/2,VH/2+14);
  ctx.textAlign="left";
}

function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.033);lastT=ts;
  update(dt);
  ctx.imageSmoothingEnabled=false;
  drawBG(dt);
  drawMedals();drawShots();drawEnemies();
  if(G.boss&&G.boss.alive)drawBoss(G.boss);
  drawBullets();drawExpl();drawPlayer();drawWarning();
  if(stage===4)drawWin();if(gameOver)drawGO();
  requestAnimationFrame(loop);
}

function startGame(){
  if(gameStarted)return;gameStarted=true;
  resize();requestAnimationFrame(loop);
}

(function loadingLoop(){
  if(gameStarted)return;
  const now=performance.now();lastT=now;
  drawLoading();requestAnimationFrame(loadingLoop);
})();
</script>
